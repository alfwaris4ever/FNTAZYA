<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة | فنتازيا</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#eef1ff;color:#1d2350}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,#5b3cff,#ec4899);color:#fff}
header img{width:40px;height:40px;border-radius:12px}header h1{margin:0;font-size:22px;flex:1}header a{color:#fff;font-weight:700}
main{max-width:1150px;margin:0 auto;padding:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(29,35,80,.08)}.card b{display:block;font-size:30px;color:#5b3cff}.card span{color:#64748b;font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
h2{font-size:18px;margin:6px 0 10px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(29,35,80,.08);font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #eef1ff}th{background:#f8fafc;color:#475569}
.bar{height:8px;border-radius:99px;background:linear-gradient(90deg,#5b3cff,#ec4899)}
.msg{background:#fff;border-radius:16px;padding:24px;text-align:center;font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:#5b3cff;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>لوحة إدارة فنتازيا</h1><a href="./">↩ الموقع</a></header>
<main id="app"><div class="msg">جاري التحميل…</div></main>
<script>
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=localStorage.getItem('fz:token');const day=t=>t?new Date(t*1000).toLocaleDateString('ar-SA-u-nu-latn'):'';
async function load(){
  if(!token){app.innerHTML='<div class="msg">سجّل دخولك في الموقع بحساب الإدارة أولاً (زر 👤 في الصفحة الرئيسية).</div>';return}
  const r=await fetch('api/index.php?a=admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'});const j=await r.json().catch(()=>({ok:false,error:'الخادم لا يستجيب'}));
  if(!j.ok){app.innerHTML=`<div class="msg">${esc(j.error)}</div>`;return}
  const max=Math.max(1,...j.topGames.map(g=>g.n));
  app.innerHTML=`<div class="cards"><div class="card"><b>${j.users}</b><span>لاعب مسجّل</span></div><div class="card"><b>${j.new7}</b><span>جديد خلال 7 أيام</span></div><div class="card"><b>${j.active7}</b><span>نشط خلال 7 أيام</span></div><div class="card"><b>${j.marketing}</b><span>وافقوا على رسائل الجديد</span></div><div class="card"><b>${j.events}</b><span>جولة لعب مسجّلة</span></div></div>
  <div class="cols"><div><h2>🎮 الألعاب الأكثر لعباً</h2><table><tr><th>اللعبة</th><th>جولات</th><th>فوز كامل</th><th></th></tr>${j.topGames.map(g=>`<tr><td>${esc(g.game)}</td><td>${g.n}</td><td>${g.wins||0}</td><td style="width:35%"><div class="bar" style="width:${g.n/max*100}%"></div></td></tr>`).join('')||'<tr><td colspan=4>لا بيانات بعد</td></tr>'}</table></div>
  <div><h2>📂 التصنيفات الأكثر لعباً</h2><table><tr><th>التصنيف</th><th>جولات</th></tr>${j.topCats.map(c=>`<tr><td>${esc(c.cat)}</td><td>${c.n}</td></tr>`).join('')||'<tr><td colspan=2>لا بيانات بعد</td></tr>'}</table></div></div>
  <h2 style="margin-top:18px">👥 اللاعبون (آخر نشاط أولاً) <button id="csv">⬇ تصدير بريد الموافقين CSV</button></h2>
  <p style="color:#64748b;font-size:13px">يظهر البريد كاملاً فقط لمن وافق ولي أمره على استلام جديد الألعاب.</p>
  <table><tr><th></th><th>الاسم</th><th>البريد</th><th>يستلم الجديد</th><th>التصنيف المفضّل</th><th>جولات</th><th>التسجيل</th><th>آخر نشاط</th></tr>
  ${j.players.map(p=>`<tr><td>${esc(p.avatar)}</td><td>${esc(p.name)}</td><td dir="ltr">${esc(p.email)}</td><td>${p.marketing?'✅':'—'}</td><td>${esc(p.favcat||'')}</td><td>${p.plays}</td><td>${day(p.created)}</td><td>${day(p.last_seen)}</td></tr>`).join('')}</table>`;
  document.getElementById('csv').onclick=()=>{const rows=[['name','email','favorite_category','plays','joined'],...j.players.filter(p=>p.marketing).map(p=>[p.name,p.email,p.favcat||'',p.plays,day(p.created)])];
    const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fntazya-players.csv';a.click()}}
load();
</script>
</body>
</html>
