<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة | فنتازيا</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#eef1ff;color:#1d2350}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,#5b3cff,#ec4899);color:#fff}
header img{width:40px;height:40px;border-radius:12px}header h1{margin:0;font-size:22px;flex:1}header a{color:#fff;font-weight:700}
main{max-width:90%;margin:0 auto;padding:18px}@media(max-width:1023px){main{max-width:100%;padding:12px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(29,35,80,.08)}.card b{display:block;font-size:30px;color:#5b3cff}.card span{color:#64748b;font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
h2{font-size:18px;margin:6px 0 10px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(29,35,80,.08);font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #eef1ff}th{background:#f8fafc;color:#475569}
.bar{height:8px;border-radius:99px;background:linear-gradient(90deg,#5b3cff,#ec4899)}
.msg{background:#fff;border-radius:16px;padding:24px;text-align:center;font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:#5b3cff;color:#fff;cursor:pointer}
button.sm,a.sm{padding:4px 7px;margin:0 2px;background:#eef1ff;color:#1d2350;font-size:14px;border-radius:10px;text-decoration:none;font-weight:700;display:inline-block;line-height:1.6}a.sm:hover{background:#dfe4ff}button.sm:hover{background:#dfe4ff}button.sm.del:hover{background:#fee2e2}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs a{padding:8px 18px;border-radius:99px;background:#fff;color:#1d2350;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(29,35,80,.08)}.tabs a.on{background:#5b3cff;color:#fff}
.toolbar{margin-bottom:12px;font-weight:700}button.sm.on{background:#5b3cff;color:#fff}
.chart{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(29,35,80,.08)}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700}.legend span[style*="--c"]::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-inline-end:5px;vertical-align:-1px}
.note{color:#64748b;font-size:13px;line-height:1.8}.chip{display:inline-block;background:#eef1ff;border-radius:99px;padding:1px 8px;font-size:12px;margin:1px}.sub{color:#64748b;font-size:12px}
img.thumb{width:120px;height:54px;object-fit:contain;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0;padding:3px;box-sizing:border-box;display:block}
.camp b{display:block;margin-bottom:8px;font-size:15px}.thumbs{display:grid;grid-template-columns:repeat(2,120px);gap:8px}
.slots{display:flex;flex-direction:column;align-items:flex-start;gap:8px}.slots .chip{margin:0;padding:4px 10px;line-height:1.5;border-radius:0;white-space:nowrap}
td.ctl{white-space:nowrap}td.ctl .sm,td.ctl a.sm{display:inline-block;margin:0 2px}
td{vertical-align:top}
textarea{width:100%;font:13px/1.6 monospace;padding:8px;border-radius:10px;border:2px solid #e2e6ff;box-sizing:border-box}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal-card{background:#fff;border-radius:18px;padding:20px;width:min(760px,100%)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm .full{grid-column:1/-1}@media(max-width:640px){.frm{grid-template-columns:1fr}}
.frm label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}.frm label.ck{flex-direction:row;align-items:center;gap:6px;font-weight:600;display:inline-flex;margin:3px 10px 3px 0}
.frm input:not([type=checkbox]),.frm select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid #e2e6ff}
.pbar{height:6px;background:#eef1ff;border-radius:99px;margin-top:4px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5b3cff,#ec4899)}
.pin{flex-direction:row!important;align-items:center;gap:6px;display:flex}.pin input[type=number]{width:90px;font:inherit;padding:6px 8px;border-radius:8px;border:2px solid #e2e6ff}
.frm fieldset{border:2px solid #eef1ff;border-radius:12px}.frm [hidden]{display:none!important}#prev img{max-width:100%;max-height:140px;margin-top:6px;border-radius:8px}
.cr-slot{border:2px solid #eef1ff;border-radius:14px;padding:10px;margin-bottom:10px}.cr-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:8px}
.cr-tile{background:#f8fafc;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}.cr-h{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.cr-prev{width:100%;max-height:150px;background:repeating-conic-gradient(#e2e8f0 0 25%,#fff 0 50%) 0 0/16px 16px;border:2px dashed #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.cr-prev img{width:100%;height:100%;object-fit:contain}.cr-prev span{color:#94a3b8;font-size:12px;font-weight:700}
.cr-info{font-size:12px;color:#64748b;min-height:1.2em}.cr-info.ok{color:#16a34a}.cr-info.warn{color:#d97706}.cr-act{display:flex;gap:6px}.sm-btn{background:#5b3cff;color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer;display:inline-block!important}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>لوحة إدارة فنتازيا</h1><a href="./">↩ الموقع</a></header>
<main id="app"><div class="msg">جاري التحميل…</div></main>
<script>
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('fz:token');const day=t=>t?new Date(t*1000).toLocaleDateString('ar-SA-u-nu-latn'):'';
async function load(){
  if(!token)return loginForm();
  if(location.hash==='#traffic')return loadTraffic();if(location.hash==='#ads')return loadAds();
  const r=await fetch('api/index.php?a=admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'});const j=await r.json().catch(()=>({ok:false,error:'الخادم لا يستجيب'}));
  if(!j.ok){if(r.status===401||r.status===403)return loginForm(r.status===403?'هذا الحساب ليس حساب الإدارة. ادخل ببريد الإدارة.':'انتهت الجلسة، ادخل من جديد.');app.innerHTML=`<div class="msg">${esc(j.error)}</div>`;return}
  const max=Math.max(1,...j.topGames.map(g=>g.n));
  app.innerHTML=tabsBar('')+`<div class="cards"><div class="card"><b>${j.users}</b><span>لاعب مسجّل</span></div><div class="card"><b>${j.new7}</b><span>جديد خلال 7 أيام</span></div><div class="card"><b>${j.active7}</b><span>نشط خلال 7 أيام</span></div><div class="card"><b>${j.marketing}</b><span>وافقوا على رسائل الجديد</span></div><div class="card"><b>${j.events}</b><span>جولة لعب مسجّلة</span></div></div>
  <div class="cols"><div><h2>🎮 الألعاب الأكثر لعباً</h2><table><tr><th>اللعبة</th><th>جولات</th><th>فوز كامل</th><th></th></tr>${j.topGames.map(g=>`<tr><td>${esc(g.game)}</td><td>${g.n}</td><td>${g.wins||0}</td><td style="width:35%"><div class="bar" style="width:${g.n/max*100}%"></div></td></tr>`).join('')||'<tr><td colspan=4>لا بيانات بعد</td></tr>'}</table></div>
  <div><h2>📂 التصنيفات الأكثر لعباً</h2><table><tr><th>التصنيف</th><th>جولات</th></tr>${j.topCats.map(c=>`<tr><td>${esc(c.cat)}</td><td>${c.n}</td></tr>`).join('')||'<tr><td colspan=2>لا بيانات بعد</td></tr>'}</table></div></div>
  <h2 style="margin-top:18px">📢 طلبات الإعلان (${(j.adRequests||[]).length})</h2><table><tr><th>التاريخ</th><th>الشركة</th><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الباقة</th><th>التفاصيل</th></tr>${(j.adRequests||[]).map(a=>`<tr><td>${day(a.ts)}</td><td>${esc(a.company)}</td><td>${esc(a.name)}</td><td dir="ltr"><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></td><td dir="ltr">${esc(a.phone)}</td><td>${esc(a.package)}</td><td style="max-width:280px">${esc(a.message)}</td></tr>`).join('')||'<tr><td colspan=7>لا توجد طلبات بعد</td></tr>'}</table>
  <h2 style="margin-top:18px">👥 اللاعبون (آخر نشاط أولاً) <button id="csv">⬇ تصدير بريد الموافقين CSV</button></h2>
  <p style="color:#64748b;font-size:13px">التصدير يشمل فقط من وافق ولي أمره على استلام جديد الألعاب. الأزرار: ✏️ الاسم · 📧 البريد · ⛔ إيقاف/▶️ تفعيل · 🗑️ حذف.</p>
  <table><tr><th></th><th>الاسم</th><th>البريد</th><th>الحالة</th><th>يستلم الجديد</th><th>التصنيف المفضّل</th><th>جولات</th><th>التسجيل</th><th>آخر نشاط</th><th>تحكم</th></tr>
  ${j.players.map(p=>`<tr${p.suspended?' style="opacity:.55"':''}><td>${esc(p.avatar)}</td><td>${esc(p.name)}</td><td dir="ltr">${esc(p.email)}</td><td>${p.suspended?'⛔ موقوف':'✅ نشط'}</td><td>${p.marketing?'✅':'—'}</td><td>${esc(p.favcat||'')}</td><td>${p.plays}</td><td>${day(p.created)}</td><td>${day(p.last_seen)}</td><td class="act" style="white-space:nowrap"><button class="sm" data-op="name" data-id="${p.id}" title="تغيير الاسم">✏️</button><button class="sm" data-op="email" data-id="${p.id}" title="تغيير البريد">📧</button><button class="sm" data-op="${p.suspended?'unsuspend':'suspend'}" data-id="${p.id}" title="${p.suspended?'تفعيل':'إيقاف'}">${p.suspended?'▶️':'⛔'}</button><button class="sm del" data-op="delete" data-id="${p.id}" title="حذف">🗑️</button></td></tr>`).join('')}</table>`;
  app.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{const p=j.players.find(x=>x.id==b.dataset.id),op=b.dataset.op;let value;
    if(op==='name'){value=prompt('الاسم الجديد لـ '+p.name,p.name);if(value==null)return}
    else if(op==='email'){value=prompt('البريد الجديد لـ '+p.name,p.email);if(value==null)return}
    else if(op==='delete'){if(!confirm('حذف العضو «'+p.name+'» ('+p.email+') وكل بياناته نهائياً؟'))return}
    else if(op==='suspend'){if(!confirm('إيقاف العضو «'+p.name+'»؟ لن يستطيع الدخول حتى تفعّله.'))return}
    const r=await fetch('api/index.php?a=admin_user',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id:p.id,op,value})});const k=await r.json().catch(()=>({ok:false,error:'الخادم لا يستجيب'}));
    if(!k.ok)return alert(k.error);load()});
  document.getElementById('csv').onclick=()=>{const rows=[['name','email','favorite_category','plays','joined'],...j.players.filter(p=>p.marketing).map(p=>[p.name,p.email,p.favcat||'',p.plays,day(p.created)])];
    const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fntazya-players.csv';a.click()}}
function loginForm(note=''){app.innerHTML=`<div class="msg" style="max-width:380px;margin:20px auto;text-align:right">
  <h2 style="margin-top:0">🔐 دخول الإدارة</h2>${note?`<p style="color:#dc2626">${esc(note)}</p>`:''}
  <p style="color:#64748b;font-weight:400;font-size:13px">ادخل ببريد الإدارة والرمز المكوّن من 4 أرقام. إذا ما عندك حساب بعد، اختر «إنشاء حساب الإدارة».</p>
  <label>البريد<br><input id="em" type="email" dir="ltr" value="alfwaris4ever@gmail.com" style="width:100%;padding:10px;border-radius:10px;border:2px solid #e2e6ff;font:inherit;margin:4px 0 10px"></label>
  <label>الرمز (4 أرقام)<br><input id="pn" inputmode="numeric" maxlength="4" dir="ltr" style="width:100%;padding:10px;border-radius:10px;border:2px solid #e2e6ff;font:inherit;font-size:22px;letter-spacing:10px;text-align:center;margin:4px 0 10px"></label>
  <div id="er" style="color:#dc2626;min-height:1.3em;font-size:13px"></div>
  <button id="li" style="width:100%;margin-bottom:8px">دخول</button><button id="rg" style="width:100%;background:#16a34a">إنشاء حساب الإدارة (أول مرة)</button></div>`;
  const go=async a=>{const email=document.getElementById('em').value.trim(),pin=document.getElementById('pn').value.trim(),er=document.getElementById('er');er.textContent='';
    if(!/^\d{4}$/.test(pin))return er.textContent='الرمز لازم يكون 4 أرقام';
    const r=await fetch('api/index.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,pin,name:'الإدارة',avatar:'👑'})});const j=await r.json().catch(()=>({ok:false,error:'الخادم لا يستجيب'}));
    if(!j.ok)return er.textContent=j.error;token=j.token;localStorage.setItem('fz:token',j.token);localStorage.setItem('fz:user',JSON.stringify(j.user));load()};
  document.getElementById('li').onclick=()=>go('login');document.getElementById('rg').onclick=()=>go('register')}
</script>
<script src="js/ad-form.js?v=20261125b"></script>
<script src="js/admin-ads.js?v=20261126c"></script>
<script>addEventListener('hashchange',load);load()</script>
<script src="js/totop.js"></script>
<script src="js/footer.js?v=3"></script>
</body>
</html>
