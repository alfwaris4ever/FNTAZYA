# فحص فروع الموظفين (dev-faris, dev-sama, ...) وطلبات الدمج إلى dev.
# يشغّل نفس فحوصات CI (dev) فقط، بدون أي ترقية أو نشر. نجاحه شرط لدمج الـ Pull Request في dev.
name: CI branches

on:
  push:
    branches: ['dev-*']
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  ci-dev:
    name: CI (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: التأكد أن كل فرع يرفع عليه صاحبه فقط (.github/branch-owners.json)
        env:
          BR: ${{ github.head_ref || github.ref_name }}
          WHO: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || github.actor }}
        run: |
          ALLOWED=$(jq -r --arg b "$BR" '.[$b] // [] | join(" ")' .github/branch-owners.json)
          if [ -z "$ALLOWED" ]; then echo "لا يوجد صاحب مسجّل للفرع $BR، تم التخطي"; exit 0; fi
          for u in $ALLOWED alfwaris4ever; do
            if [ "$u" = "$WHO" ]; then echo "OK: $WHO يعمل على فرعه $BR"; exit 0; fi
          done
          echo "FAIL: الفرع $BR خاص بـ $ALLOWED، لكن الذي رفع أو فتح الطلب هو $WHO"; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: فحص الملفات والسكربتات والمراجع
        run: node scripts/ci-check.mjs
      - name: اختبار تشغيل الموقع في Chrome
        run: node scripts/smoke-test.mjs
