# سلسلة النشر: dev -> (CI) -> staging -> (CI) -> main -> رفع FTP إلى fntazya.com -> تحقق
# أي رفع على dev يشغّل السلسلة كاملة. لا يُرقّى أي فرع إلا بعد نجاح فحوصات المرحلة السابقة.
# فروع الموظفين وطلبات الدمج لها ملف مستقل (ci-branches.yml) حتى لا تظهر فحوص staging "متخطّاة" على نفس الـ commit فتعطّل الترقية.
name: Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  ci-dev:
    name: CI (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: فحص الملفات والسكربتات والمراجع
        run: node scripts/ci-check.mjs
      - name: اختبار تشغيل الموقع في Chrome
        run: node scripts/smoke-test.mjs

  promote-staging:
    name: Promote dev -> staging
    needs: ci-dev
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ترقية نفس الـ commit إلى staging
        run: git push origin "${GITHUB_SHA}:refs/heads/staging"

  ci-staging:
    name: CI (staging)
    needs: promote-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
      - name: التأكد أن staging هو نفس الـ commit المختبر
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: الفحوصات الأساسية
        run: node scripts/ci-check.mjs
      - name: اختبار تشغيل الموقع في Chrome
        run: node scripts/smoke-test.mjs

  promote-main:
    name: Promote staging -> main
    needs: ci-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ترقية نفس الـ commit إلى main
        run: git push origin "${GITHUB_SHA}:refs/heads/main"

  deploy:
    name: Deploy main -> fntazya.com
    needs: promote-main
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: رفع ملفات الموقع إلى Hostinger عبر FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 88.222.209.119
          username: u835938161.githubdeploy
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            **/*.md
      - name: إعداد بريد الموقع (SMTP) من سرّ GitHub
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then echo "لا يوجد سرّ SMTP_PASSWORD، تخطّي"; exit 0; fi
          php -r 'file_put_contents("smtp-config.php", "<?php\nreturn " . var_export(["host"=>"smtp.hostinger.com","port"=>465,"user"=>"no-reply@fntazya.com","pass"=>getenv("SMTP_PASSWORD")], true) . ";\n");'
          curl -fsS --max-time 60 --user "u835938161.githubdeploy:$FTP_PASSWORD" -T smtp-config.php "ftp://88.222.209.119/api/smtp-config.php"
          rm -f smtp-config.php
          echo "OK: تم إعداد بريد الموقع"

  verify-live:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    env:
      FTP_URL: ftp://88.222.209.119
      FTP_USER: u835938161.githubdeploy
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: مطابقة ملفات الموقع (html/css/js) على الخادم مع النسخة المنشورة
        run: |
          fail=0; n=0
          for f in index.html $(find css js -type f 2>/dev/null | sort); do
            n=$((n+1))
            if ! curl -fsS --max-time 60 --user "$FTP_USER:$FTP_PASSWORD" "$FTP_URL/$f" -o live.tmp; then echo "FAIL غير موجود على الخادم: $f"; fail=1; continue; fi
            cmp -s <(tr -d '\r' < "$f") <(tr -d '\r' < live.tmp) || { echo "FAIL لا يطابق: $f"; fail=1; }
          done
          [ $fail = 0 ] && echo "OK: $n ملف على الخادم يطابق النسخة المنشورة"
          exit $fail
      - name: التأكد من وجود كل صور الألعاب على الخادم
        run: |
          curl -fsS --max-time 60 --user "$FTP_USER:$FTP_PASSWORD" --list-only "$FTP_URL/thumbs/" > remote.txt
          fail=0
          for f in thumbs/*.webp; do
            grep -qx "$(basename "$f")" <(tr -d '\r' < remote.txt) || { echo "FAIL ناقصة: $f"; fail=1; }
          done
          if [ $fail = 0 ]; then echo "OK: كل الصور موجودة ($(ls thumbs/*.webp | wc -l))"; fi
          exit $fail