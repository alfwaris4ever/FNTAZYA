# سلسلة النشر: dev -> (CI) -> staging -> (CI) -> main -> رفع FTP إلى fntazya.com -> تحقق
# أي رفع على dev يشغّل هذا الملف. لا يُرقّى أي فرع إلا بعد نجاح فحوصات المرحلة السابقة.
name: Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  ci-dev:
    name: CI (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: فحص الملفات والسكربتات والمراجع
        run: node scripts/ci-check.mjs

  promote-staging:
    name: Promote dev -> staging
    needs: ci-dev
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ترقية نفس الـ commit إلى staging
        run: git push origin "${GITHUB_SHA}:refs/heads/staging"

  ci-staging:
    name: CI (staging)
    needs: promote-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
      - name: التأكد أن staging هو نفس الـ commit المختبر
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: الفحوصات الأساسية
        run: node scripts/ci-check.mjs
      - name: اختبار تشغيل الموقع في Chrome
        run: node scripts/smoke-test.mjs

  promote-main:
    name: Promote staging -> main
    needs: ci-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ترقية نفس الـ commit إلى main
        run: git push origin "${GITHUB_SHA}:refs/heads/main"

  deploy:
    name: Deploy main -> fntazya.com
    needs: promote-main
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: رفع ملفات الموقع إلى Hostinger عبر FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.fntazya.com
          username: u835938161.githubdeploy
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            README.md

  verify-live:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: مطابقة الموقع المباشر مع النسخة المنشورة
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsSL "https://fntazya.com/?v=$(date +%s)" -H 'Cache-Control: no-cache' | tr -d '\r' > live.html || true
            if cmp -s <(tr -d '\r' < index.html) live.html; then echo "OK: fntazya.com يطابق index.html"; exit 0; fi
            echo "محاولة $i: لم يتطابق بعد، انتظار..."; sleep 20
          done
          echo "FAIL: الموقع المباشر لا يطابق index.html"; exit 1
      - name: فحص صور الألعاب على الموقع
        run: |
          fail=0
          for f in thumbs/*.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://fntazya.com/$f")
            [ "$code" = "200" ] || { echo "FAIL $f -> $code"; fail=1; }
          done
          [ $fail = 0 ] && echo "OK: كل الصور موجودة"
          exit $fail