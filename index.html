<!-- ============ HOME ============ -->
<main id="view-home" class="home">
  <div class="grid" id="grid">
    <div class="logo-card">
      <a class="logo" href="#/" aria-label="فنتازيا - الرئيسية"><img class="mark mark-img" src="icon-192.png" alt="">فنتازيا<small>وقت اللعب الصح</small></a>
      <div class="logo-actions">
        <a class="icon-btn" href="#/" title="الرئيسية" aria-label="الرئيسية">🏠</a>
        <button class="icon-btn" data-open-search title="بحث" aria-label="بحث">🔍</button>

  <p class="footer">© فنتازيا 2026 · ألعاب آمنة وتعليمية للأطفال · تعمل على الجوال والتابلت والكمبيوتر · <a href="advertise.html" style="color:inherit;font-weight:800">📢 أعلن معنا</a></p>
</main>

<!-- ============ GAME ============ -->
<section id="view-game" class="game-view" hidden>
  <div class="game-layout">
    <div class="game-main">
      <div class="game-bar">
        <a class="bar-btn" href="#/" aria-label="رجوع">➡️</a>
        <a class="bar-logo" href="#/"><img class="mark mark-img" src="icon-192.png" alt=""><span>فنتازيا</span></a>
        <h1 id="gTitle"></h1>
        <button class="bar-btn" id="restartBtn" title="إعادة" aria-label="إعادة">🔄</button>
        <button class="bar-btn" id="favBtn" title="مفضلة" aria-label="إضافة للمفضلة">🤍</button>
        <button class="bar-btn" id="soundBtn" title="الصوت" aria-label="الصوت">🔊</button>
        <button class="bar-btn" id="fsBtn" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
      </div>
      <div class="stage-wrap" id="stageWrap"><div id="stage"></div><button class="fs-exit" id="fsExit" aria-label="الخروج من ملء الشاشة">✕ <span>خروج</span></button></div>
      <div class="info-card" id="gInfo"></div>
    </div>
    <aside class="related">
      <h3>🎮 ألعاب قد تعجبك</h3>
      <div class="grid" id="related"></div>
    </aside>
  </div>
</section>

<!-- ============ SEARCH ============ -->
<div class="search-ov" id="search" hidden>
  <div class="search-panel">
    <div class="search-row">
      <input id="q" type="search" placeholder="ابحث عن لعبة..." autocomplete="off" aria-label="ابحث عن لعبة">
      <button class="bar-btn" id="closeSearch" aria-label="إغلاق">✕</button>
    </div>
    <p class="search-hint" id="sHint"></p>
    <div class="grid" id="results"></div>
  </div>
</div>
