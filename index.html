<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3cff">
<meta name="description" content="فنتازيا: ألعاب أطفال مجانية باللغة العربية، تعليمية وممتعة وآمنة، تعمل على الجوال والتابلت والكمبيوتر.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>فنتازيا | ألعاب أطفال مجانية بالعربي</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cell:94px; --gap:16px; --pad:24px; --r:18px;
  --bg:#cfe4ff; --ink:#1d2350; --brand:#5b3cff; --brand2:#ff4f9a; --card:#fff;
  --shadow:0 5px 0 rgba(29,35,80,.10),0 10px 22px rgba(29,35,80,.12);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Baloo Bhaijaan 2",Tahoma,system-ui,sans-serif;color:var(--ink);
  background:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.6) 2px,transparent 2.6px);
  background-size:28px 28px;min-height:100dvh;
  padding:env(safe-area-inset-top,0) var(--safe-r) env(safe-area-inset-bottom,0) var(--safe-l);
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}

/* ============ HOME GRID (Poki-like) ============ */
.home{padding:var(--pad) var(--pad) 40px}
.home,.related,.search-panel{container-type:inline-size}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,var(--cell));grid-auto-rows:var(--cell);
  gap:var(--gap);grid-auto-flow:dense;justify-content:center;
}
.logo-card{
  grid-column:1/span 2;grid-row:1;position:sticky;top:12px;z-index:20;
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.logo .mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#ffcf3f,#ff4f9a);display:grid;place-items:center;font-size:20px;transform:rotate(-8deg);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.logo small{font-size:12px;color:#8a90b8;font-weight:700;margin-inline-start:auto}
.logo-actions{display:flex;gap:6px}
.icon-btn{flex:1;height:34px;border-radius:12px;background:#eef1ff;display:grid;place-items:center;font-size:17px;transition:transform .15s,background .15s}
.icon-btn:hover{background:#dfe4ff;transform:translateY(-2px)}

.tile{
  position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(145deg,var(--c1),var(--c2));display:grid;place-items:center;
  transition:transform .22s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;isolation:isolate;text-align:center;
}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.5),transparent 55%)}
.tile::after{content:"";position:absolute;inset:auto -20% -40% auto;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12);z-index:-1}
.tile .emo{font-size:calc(var(--cell)*.5);line-height:1;color:#fff;font-weight:800;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18));transition:transform .25s}
.tile.big .emo{font-size:calc(var(--cell)*1.02)}
.tile .name{
  position:absolute;inset-inline:0;bottom:0;padding:22px 6px 6px;font-weight:800;color:#fff;
  font-size:14px;line-height:1.15;background:linear-gradient(transparent,rgba(0,0,0,.55));
  opacity:0;transform:translateY(8px);transition:.2s;
}
.tile.big .name{font-size:clamp(15px,calc(var(--cell)*.2),22px);opacity:1;transform:none;padding-bottom:10px}
.tile.big .emo{margin-bottom:12%}
.tile .badge{position:absolute;top:7px;inset-inline-start:7px;background:#fff;color:var(--brand2);font-size:11px;font-weight:800;padding:0 8px;border-radius:99px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.tile.soon{filter:saturate(.25) brightness(1.05);cursor:default}
.tile.soon .badge{color:#667}
.tile:active{transform:scale(.96)}
@media (hover:hover){
  .tile:hover,.tile:focus-visible{transform:scale(1.07) rotate(-1.5deg);z-index:5;box-shadow:0 10px 0 rgba(29,35,80,.10),0 18px 30px rgba(29,35,80,.22)}
  .tile:hover .name,.tile:focus-visible .name{opacity:1;transform:none}
  .tile:hover .emo{transform:scale(1.12) rotate(4deg)}
}
.tile.big{grid-column:span 2;grid-row:span 2}

/* صور الألعاب الاحترافية + حركة حيّة عند المرور أو اللمس (فكرة معاينة بوكي بدون فيديو) */
.tile.has-img{background:#1d2350}
.tile.has-img::before{z-index:1;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 45%);opacity:0;transition:opacity .25s;pointer-events:none}
.tile.has-img::after{inset:0;width:auto;aspect-ratio:auto;border-radius:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 47%,rgba(255,255,255,.12) 55%,transparent 70%);transform:translateX(-130%)}
.tile.has-img .emo{display:none}
.tile .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .3s;-webkit-user-drag:none;user-select:none}
.tile.has-img .name,.tile.has-img .badge{z-index:3}
.tile.has-img .name{background:linear-gradient(transparent,rgba(10,12,40,.78));text-shadow:0 2px 4px rgba(0,0,0,.45)}
.tile.soon.has-img{filter:none}.tile.soon .thumb{filter:saturate(.45) brightness(.92)}
@keyframes alive{0%{transform:scale(1.08) translate(0,0)}50%{transform:scale(1.15) translate(-2.5%,-1.5%)}100%{transform:scale(1.1) translate(2%,-2.5%)}}
@keyframes shine{to{transform:translateX(130%)}}
@keyframes tapsq{0%{transform:scale(1)}35%{transform:scale(.9)}70%{transform:scale(1.06)}100%{transform:scale(1.02)}}
@media (hover:hover){
  .tile.has-img:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.07)}
  .tile.has-img:hover .thumb{animation:alive 4s ease-in-out infinite alternate}
  .tile.has-img:hover::after{animation:shine .8s ease-out}
  .tile.has-img:hover::before{opacity:1}
  .tile.soon.has-img:hover .thumb{filter:saturate(.85)}
}
.tile.has-img.tap{animation:tapsq .32s ease}
.tile.has-img.tap .thumb{transform:scale(1.14)}
.tile.has-img.tap::after{animation:shine .45s ease-out}
.tile.has-img.tap .name{opacity:1;transform:none}

.cat-head{
  grid-column:span 3;display:flex;align-items:center;gap:12px;padding:0 16px;color:#fff;
  border-radius:var(--r);box-shadow:var(--shadow);background:linear-gradient(135deg,var(--c1),var(--c2));
}
.cat-head span{font-size:calc(var(--cell)*.45)}
.cat-head h1{margin:0;font-size:clamp(18px,calc(var(--cell)*.26),28px);line-height:1.1}
.cat-head small{opacity:.9;font-weight:700}
.empty{grid-column:1/-1;display:grid;place-items:center;background:#fff9;border-radius:var(--r);font-weight:700;color:#556}

.sec-title{text-align:center;margin:40px 0 14px;font-size:clamp(20px,3vw,28px)}
.cat-tile{
  grid-column:span 2;border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;
  padding:0 14px;color:#fff;font-weight:800;font-size:clamp(14px,calc(var(--cell)*.19),20px);line-height:1.15;
  background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .2s cubic-bezier(.3,1.6,.5,1);
}
.cat-tile span{font-size:calc(var(--cell)*.42);filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
@media (hover:hover){.cat-tile:hover{transform:scale(1.05)}}
.cat-bar{grid-column:3/-1;grid-row:1/span var(--cr,1);display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:8px;min-width:0;padding:2px 0}
.cat-chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 11px;border-radius:99px;color:#fff;font-weight:800;font-size:14px;white-space:nowrap;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 3px 0 rgba(29,35,80,.16);transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.cat-chip span{font-size:19px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.cat-chip.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c1)}
@media (hover:hover){.cat-chip:hover{transform:translateY(-2px) scale(1.04)}}
.logo small{white-space:nowrap;font-size:11px}
.cat-bar.two{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;justify-content:start;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:6px;-webkit-mask-image:linear-gradient(to left,transparent 0,#000 40px);mask-image:linear-gradient(to left,transparent 0,#000 40px)}
.cat-bar.two::-webkit-scrollbar{display:none}
@media (max-width:1023px){.cat-chip{height:34px;font-size:13px;padding:0 11px 0 9px;gap:5px}.cat-chip span{font-size:17px}.cat-bar{gap:6px}}
.footer{text-align:center;color:#5a6290;font-weight:600;font-size:14px;padding:30px 16px 10px}

/* ============ SEARCH ============ */
.search-ov{position:fixed;inset:0;z-index:60;background:rgba(29,35,80,.45);backdrop-filter:blur(6px);overflow:auto;padding:max(12px,env(safe-area-inset-top)) var(--pad) 24px}
.search-panel{max-width:1100px;margin:0 auto;background:var(--bg);border-radius:24px;padding:16px;box-shadow:var(--shadow);animation:pop .25s}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-row input{flex:1;min-width:0;height:52px;border-radius:16px;border:3px solid transparent;padding:0 16px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:#fff;outline:none}
.search-row input:focus{border-color:var(--brand)}
.search-hint{text-align:center;color:#5a6290;font-weight:700;margin:4px 0 12px}

/* ============ GAME VIEW ============ */
.game-view{padding:12px var(--pad) 32px}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;max-width:1500px;margin:0 auto;align-items:start}
.game-bar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:var(--r);padding:7px;box-shadow:var(--shadow);margin-bottom:12px}
.game-bar h1{font-size:clamp(16px,2.2vw,24px);margin:0 4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-btn{width:42px;height:42px;border-radius:12px;background:#eef1ff;font-size:19px;display:grid;place-items:center;flex:none;transition:transform .15s,background .15s}
.bar-btn:hover{background:#dfe4ff}
.bar-btn:active{transform:scale(.92)}
.bar-btn.on{background:#ffe1ee}
.bar-logo{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--brand);font-size:22px;padding-inline:4px}
.bar-logo .mark{width:30px;height:30px;font-size:16px;border-radius:10px;background:linear-gradient(135deg,#ffcf3f,#ff4f9a);display:grid;place-items:center;transform:rotate(-8deg)}
.stage-wrap{position:relative;background:#1d2350;border-radius:calc(var(--r) + 6px);padding:7px;box-shadow:var(--shadow)}
#stage{
  position:relative;height:clamp(380px,calc(100dvh - 200px),780px);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(160deg,#fff7e0,#ffe3f1 60%,#e3e9ff);container-type:size;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.stage-wrap:fullscreen{padding:0;border-radius:0;background:#1d2350}
.stage-wrap:fullscreen #stage{height:100dvh;border-radius:0}
.stage-wrap.pseudo-fs{position:fixed;inset:0;z-index:100;padding:env(safe-area-inset-top) var(--safe-r) env(safe-area-inset-bottom) var(--safe-l);border-radius:0}
.stage-wrap.pseudo-fs #stage{height:100%;border-radius:0}
.info-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.info-card h2{margin:0 0 6px;font-size:22px}
.info-card p{margin:6px 0;line-height:1.7;color:#454b75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#eef1ff;border-radius:99px;padding:2px 12px;font-weight:700;font-size:14px}
.related{position:sticky;top:12px}
.related h3{margin:0 0 10px;font-size:20px}
.related .grid{justify-content:start}

/* ============ IN-GAME UI ============ */
.hud{position:absolute;top:10px;inset-inline:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:3;flex-wrap:wrap;pointer-events:none}
.pill{background:#fff;border-radius:99px;padding:3px 14px;font-weight:800;font-size:clamp(13px,3.6cqmin,19px);box-shadow:0 3px 0 rgba(29,35,80,.12);white-space:nowrap}
.body{position:absolute;inset:var(--hud,58px) 10px 10px;display:grid;place-items:center}
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(29,35,80,.55);backdrop-filter:blur(4px);animation:fade .2s}
.overlay.start{background:linear-gradient(145deg,var(--c1),var(--c2))}
.overlay.start::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.25) 2px,transparent 3px);background-size:26px 26px}
.ov-card{max-height:calc(100% - 8px);overflow:auto;position:relative;background:#fff;border-radius:28px;padding:clamp(14px,4cqmin,28px) clamp(16px,5cqmin,36px);text-align:center;max-width:min(92%,460px);box-shadow:0 8px 0 rgba(0,0,0,.12);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.ov-emo{font-size:clamp(46px,16cqmin,96px);line-height:1.1;animation:bob 2s ease-in-out infinite}
.ov-card h2{margin:4px 0;font-size:clamp(20px,6cqmin,34px)}
.ov-card p{margin:4px 0 12px;color:#555b85;font-weight:600;font-size:clamp(13px,3.6cqmin,17px);line-height:1.6}
.ov-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.play-btn{background:linear-gradient(#4ade80,#16a34a);color:#fff;font-weight:800;font-size:clamp(18px,5cqmin,26px);padding:8px 30px;border-radius:99px;box-shadow:0 6px 0 #0f7a35;transition:transform .1s}
.play-btn.alt{background:linear-gradient(#a5b4fc,#6366f1);box-shadow:0 6px 0 #3f43b5}
.play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0f7a35}
.stars{font-size:clamp(22px,7cqmin,36px);letter-spacing:4px}
.stars .dim{filter:grayscale(1);opacity:.35}
.next-hint{margin-top:12px;font-weight:700;color:#8a90b8;font-size:clamp(12px,3.2cqmin,15px)}
.lvl{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.diff-label{font-weight:800;margin:2px 0 8px;color:#555b85;font-size:clamp(13px,3.6cqmin,17px)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);min-width:min(360px,78cqw);gap:clamp(6px,2cqmin,12px)}
.diff-btn{display:flex;flex-direction:column;align-items:center;padding:clamp(6px,1.6cqmin,12px) 4px;border-radius:18px;color:#fff;background:linear-gradient(var(--a),var(--b));box-shadow:0 5px 0 var(--s);transition:transform .12s;line-height:1.25;min-width:0}
.diff-btn .de{font-size:clamp(22px,7cqmin,38px)}
.diff-btn b{font-size:clamp(16px,4.6cqmin,24px)}
.diff-btn small{font-size:clamp(10px,2.6cqmin,13px);font-weight:700;opacity:.95;white-space:nowrap}
.diff-btn:hover{transform:translateY(-3px)}
.diff-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--s)}
.diff-btn.sel{outline:3px solid var(--ink);outline-offset:3px}
.levels-note{font-weight:700;color:var(--brand)!important}
.stroop{font-size:clamp(48px,20cqmin,150px);font-weight:800;line-height:1.1}
.big-pic{font-size:clamp(70px,28cqmin,200px);line-height:1}
.hud .lvl{pointer-events:auto;cursor:pointer;border:0;font:inherit;font-weight:800;font-size:clamp(13px,3.6cqmin,19px);display:inline-flex;align-items:center;gap:4px;transition:transform .12s,filter .12s}
.hud .lvl:hover{transform:translateY(-2px);filter:brightness(1.08)}
.hud .lvl:active{transform:scale(.95)}
.hud .lvl .chev{background:rgba(255,255,255,.3);border-radius:99px;width:1.25em;height:1.25em;display:inline-grid;place-items:center;font-size:.8em}
#stage.paused .bal,#stage.paused .cloud,#stage.paused .tbar i{animation-play-state:paused}
.fs-exit{display:none;position:absolute;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:99px;background:rgba(29,35,80,.85);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.25);backdrop-filter:blur(4px);transition:transform .12s,background .12s}
.fs-exit:hover{background:#ef4444;transform:scale(1.05)}
.stage-wrap:fullscreen .fs-exit,.stage-wrap.pseudo-fs .fs-exit{display:flex}
.stage-wrap:fullscreen .hud,.stage-wrap.pseudo-fs .hud{inset-inline-end:130px}
@container (max-width:420px){.hud .lvl{font-size:12px;padding:3px 10px}}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.result{display:flex;justify-content:center;align-items:baseline;gap:10px;margin:4px 0 0;font-weight:800;line-height:1.05}
.result b{font-size:clamp(40px,13cqmin,72px)}
.result span{font-size:clamp(18px,5cqmin,28px);color:#8a90b8}
.result.ok b:first-child{color:#16a34a}.result.bad b:first-child{color:#dc2626}
.result-label{font-weight:700;color:#8a90b8;font-size:clamp(12px,3.2cqmin,15px);margin-bottom:2px}
.kbnav .ov-btns{flex-direction:column;align-items:stretch}
.kbnav .ov-btns .play-btn{background:linear-gradient(#cbd5e1,#94a3b8);box-shadow:0 6px 0 #64748b;transition:transform .12s,background .15s}
.kbnav .ov-btns .play-btn.kb-sel{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 6px 0 #0f7a35;transform:scale(1.04)}
.kbnav{padding:clamp(12px,3cqmin,22px) clamp(16px,4cqmin,30px)}
.kbnav .ov-emo{font-size:clamp(34px,9cqmin,60px)}
.kbnav .stars{font-size:clamp(18px,5cqmin,28px)}
.kbnav h2{font-size:clamp(18px,5cqmin,28px)}
.kbnav p{margin:4px 0 10px}
.kbnav .ov-btns{gap:12px}
.kbnav .ov-btns .play-btn{font-size:clamp(16px,4.2cqmin,22px);padding:6px 26px}
@container (max-height:680px){.kbnav .ov-emo{display:none}}
@container (max-height:520px){.kbnav .stars,.kbnav .result-label{display:none}}
.ov-card{scrollbar-width:thin}
.lv-card{width:min(96%,500px);max-width:min(96%,500px)}
.lv-head{display:flex;align-items:center;justify-content:center;gap:10px}
.lv-emo{font-size:clamp(30px,8cqmin,48px);line-height:1}
.lv-card h2{margin:0}
.lv-card p{margin:6px 0 10px}
.lv-card .diffs{min-width:0;gap:8px}
.lv-card .diff-btn{flex-direction:row;justify-content:center;gap:6px;padding:7px 4px;border-radius:14px;opacity:.55;transform:scale(.96)}
.lv-card .diff-btn.sel{opacity:1;transform:none}
.lv-card .diff-btn .de{font-size:clamp(16px,4.4cqmin,22px)}
.lv-card .diff-btn b{font-size:clamp(14px,3.8cqmin,19px)}
.lv-card .diff-btn small{font-size:11px;background:rgba(255,255,255,.25);border-radius:99px;padding:0 6px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.8cqmin,11px);margin:14px 0 16px}
.stg{position:relative;aspect-ratio:1/.85;border-radius:14px;background:#eef1ff;box-shadow:0 4px 0 #c9cff5;font-weight:800;font-size:clamp(16px,4.6cqmin,24px);display:grid;place-items:center;color:var(--ink);transition:transform .12s}
.stg:not(.locked):hover{transform:translateY(-3px)}
.stg.ok{background:linear-gradient(#fef08a,#facc15);box-shadow:0 4px 0 #ca8a04}

@container (max-height:520px){.lv-card p,.lv-card .next-hint{display:none}.stages{margin:8px 0 10px}.stg{aspect-ratio:1/.6}}

.choice .cap{display:block;font-size:clamp(16px,4.6cqmin,28px);line-height:1.3;visibility:hidden}

.coach{position:absolute;z-index:30;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;max-width:min(92%,480px);background:rgba(29,35,80,.8);color:#fff;border-radius:16px;padding:7px 16px 4px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.18);backdrop-filter:blur(4px);pointer-events:none}

.coach-dots{display:flex;gap:5px;justify-content:center;margin:6px 0 2px}.coach-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}.coach-dots i.on{background:#facc15}

.stage-wrap.practicing::before{content:"🎓 تدريب";position:absolute;top:-15px;left:50%;transform:translateX(-50%);z-index:40;background:linear-gradient(#fde047,#f59e0b);color:#1d2350;font-weight:800;font-size:17px;padding:3px 20px;border-radius:99px;box-shadow:0 4px 0 #b45309;animation:tbob 2s ease-in-out infinite;pointer-events:none;white-space:nowrap}

/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:min(2cqmin,12px);width:min(96cqw,calc((100cqh - var(--hud,58px) - 16px) * var(--cols) / var(--rows)));aspect-ratio:var(--cols)/var(--rows)}
.mem-card{position:relative;border-radius:min(3cqmin,16px);transition:transform .35s;transform-style:preserve-3d;font-size:min(calc(70cqmin / var(--rows)),64px)}
.mem-card span{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mem-card .f{background:linear-gradient(145deg,#7c5cff,#5b3cff);color:#ffd84d;font-size:.6em}
.mem-card .bk{background:#fff;transform:rotateY(180deg)}
.mem-card.flip{transform:rotateY(180deg)}
.mem-card.ok .bk{background:#c9f7d8;animation:pop .4s}

/* tic tac toe */
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:min(2.5cqmin,14px);width:min(88cqw,calc(100cqh - var(--hud,58px) - 16px));aspect-ratio:1}
.cell{min-width:0;min-height:0;overflow:hidden;line-height:1;padding:0;background:#fff;border-radius:min(4cqmin,22px);font-size:min(17cqmin,110px);display:grid;place-items:center;box-shadow:0 5px 0 #c9cff5}
.cell.on{animation:pop .3s}
.cell.win{background:#fff3b0}

/* snake */
.snake-body{display:flex;align-items:center;justify-content:center;gap:12px}
.snake-body canvas{border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.15);touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;direction:ltr}
.dpad button{background:#fff;border-radius:16px;font-size:24px;box-shadow:0 4px 0 #c9cff5}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9cff5}
.dpad [data-d=u]{grid-column:2;grid-row:1}.dpad [data-d=l]{grid-column:1;grid-row:2}.dpad [data-d=d]{grid-column:2;grid-row:2}.dpad [data-d=r]{grid-column:3;grid-row:2}

/* whack */
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3cqmin;width:min(90cqw,calc(100cqh - var(--hud,58px) - 16px));aspect-ratio:1}
.hole{position:relative;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#4a2c14 0 40%,#7a4f2a 41% 55%,#8bd450 56%)}
.mole{position:absolute;inset:0;display:grid;place-items:center;font-size:min(17cqmin,100px);transform:translateY(85%);transition:transform .14s}
.hole.up .mole{transform:translateY(4%)}
.hole.hit .mole{transform:translateY(4%) scale(.8) rotate(18deg);filter:grayscale(.6)}
.hole.hit::after{content:"💥";position:absolute;inset:0;display:grid;place-items:center;font-size:min(14cqmin,80px);animation:pop .3s}

/* balloons */
.sky{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#bfe6ff,#e9f7ff)}
.bal{position:absolute;bottom:-25cqmin;font-size:clamp(46px,15cqmin,100px);line-height:1;animation:rise var(--d) linear forwards;translate:-50% 0;touch-action:none}
.bal.pop{animation:burst .2s forwards}
@keyframes rise{to{transform:translateY(calc(-100cqh - 40cqmin))}}
@keyframes burst{to{transform:scale(1.8);opacity:0}}
.cloud{position:absolute;font-size:12cqmin;opacity:.9;animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-30cqw)}to{transform:translateX(130cqw)}}

/* simon */
.simon{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:min(2.6cqmin,16px);width:min(90cqw,calc((100cqh - var(--hud,58px) - 20px) * var(--cols) / var(--rows)));aspect-ratio:var(--cols)/var(--rows)}
.pad{display:grid;place-items:center;min-width:0;min-height:0;padding:0;color:rgba(255,255,255,.85);font-size:min(calc(26cqmin / var(--rows)),56px);line-height:1;border-radius:min(4cqmin,26px);opacity:.5;transition:opacity .1s,transform .1s,filter .1s;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.simon.four .pad:nth-child(1){border-start-start-radius:50%}.simon.four .pad:nth-child(2){border-start-end-radius:50%}.simon.four .pad:nth-child(3){border-end-start-radius:50%}.simon.four .pad:nth-child(4){border-end-end-radius:50%}
.pad span{text-shadow:0 2px 2px rgba(0,0,0,.2);pointer-events:none}
.pad.lit{opacity:1;transform:scale(1.04);filter:brightness(1.25)}

/* quiz */
.quiz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqmin;width:100%;height:100%}
.q{font-size:clamp(34px,15cqmin,130px);font-weight:800;line-height:1.1;text-align:center}
.q-hint{font-size:clamp(15px,4.4cqmin,24px);font-weight:700;color:#555b85;margin-top:1cqmin}
.big-letter{font-size:clamp(70px,28cqmin,200px);color:var(--brand);line-height:1.5;margin:-.15em 0 .1em;text-shadow:0 6px 0 rgba(91,60,255,.18)}
.blob{width:clamp(80px,32cqmin,240px);aspect-ratio:1;border-radius:42% 58% 55% 45%/50% 45% 55% 50%;margin:auto;box-shadow:inset 0 -12px 0 rgba(0,0,0,.15),0 6px 0 rgba(0,0,0,.08);animation:wobble 3s ease-in-out infinite}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5cqmin;width:min(94cqw,680px)}
.choices.n3{grid-template-columns:repeat(3,1fr)}

.choice{background:#fff;border-radius:18px;padding:min(2.4cqmin,16px) 6px;font-size:clamp(20px,7cqmin,50px);font-weight:800;box-shadow:0 5px 0 #c9cff5;transition:transform .1s;line-height:1.2}
.choice .pic{font-size:1.5em}
.choice:active{transform:translateY(3px)}
.choice.ok{background:#4ade80;color:#fff;box-shadow:0 5px 0 #16a34a;animation:pop .35s}
.choice.bad{background:#f87171;color:#fff;box-shadow:0 5px 0 #b91c1c;animation:shake .4s}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;background:var(--ink);color:#fff;padding:10px 22px;border-radius:99px;font-weight:700;z-index:200;box-shadow:var(--shadow);animation:pop .25s}

@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes wobble{50%{border-radius:55% 45% 48% 52%/45% 55% 45% 55%;transform:rotate(6deg)}}

/* ============ RESPONSIVE ============ */
@media (min-width:1600px){:root{--cell:108px;--gap:18px}}
@media (min-width:600px) and (max-width:1023px){:root{--cell:88px;--gap:12px;--pad:16px}}

@media (max-width:599px){
  :root{--pad:12px;--gap:10px;--r:15px;--cell:calc((100cqw - var(--gap)*3) / 4 - .5px)}
  #grid{grid-template-rows:60px}

  #stage{height:calc(100dvh - 86px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:360px}

}

/* Fold cover screens & very small phones (Galaxy Z Fold cover ≈ 280-344px) */
@media (max-width:340px){
  :root{--pad:8px;--gap:8px;--r:13px}

/* phones in landscape: game uses full height */
@media (max-height:520px) and (orientation:landscape){

  .game-main,.related{padding-inline:12px}

  #stage{height:calc(100dvh - 90px)}
}

@media (vertical-viewport-segments:2){
  .game-view{padding-block:0}
  .game-layout{grid-template-columns:1fr;row-gap:calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0))}
  .game-main{height:env(viewport-segment-height 0 0);display:flex;flex-direction:column;padding-top:6px}
  #stage{height:calc(env(viewport-segment-height 0 0) - 76px)}
  .info-card{display:none}
}

}

/* ===== حزمة الألعاب الأشهر ===== */
.ar-cv{display:block;border-radius:16px;box-shadow:0 6px 0 rgba(29,35,80,.15);touch-action:none}

.tpad{pointer-events:auto;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.82);font-size:24px;box-shadow:0 4px 0 rgba(29,35,80,.25);touch-action:none;-webkit-user-select:none;user-select:none}

/* مكعبات */
.bk-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;height:100%}
.bk-wrap.land{flex-direction:row;gap:20px}

#stage .ov-card{color:#1d2350}
.bk-board{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px;width:var(--bs);height:var(--bs);background:#1d2350;padding:6px;border-radius:16px;box-sizing:border-box;touch-action:none}
.bk-c{background:rgba(255,255,255,.12);border-radius:5px;transition:filter .2s}

.df-c{background:hsl(var(--h) 80% 88%);border-radius:10px;display:grid;place-items:center;font-size:calc(var(--pw) / var(--c) * .5);position:relative;line-height:1;min-width:0;min-height:0}

/* فرز الألوان */

.st-t{width:min(64px,calc(86cqw / var(--per) - 10px));height:min(230px,calc((100cqh - var(--hud,58px) - 60px) / var(--rows,1)));border:4px solid rgba(29,35,80,.55);border-top:0;border-radius:0 0 30px 30px;background:rgba(255,255,255,.6);display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding:5px 3px;gap:3px;transition:transform .15s;box-sizing:border-box}

.st-t.sel{transform:translateY(-10px)}

/* اختبار الذكاء */

.dr-tg{flex:0 0 34%;max-width:34%;background:#fff;border-radius:16px;padding:6px;box-shadow:0 4px 0 #c9cff5;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;height:62%;min-height:0;box-sizing:border-box}
.dr-tg small{font-weight:800;color:#555b85;font-size:clamp(11px,3cqmin,14px)}
.dr-svg{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.dr-svg svg,.dr-me svg{height:100%;width:auto;max-width:100%;display:block}
.dr-me{flex:1 1 0;height:100%;min-height:0;min-width:0;display:grid;place-items:center}
.dr-hid{font-size:clamp(40px,10cqmin,80px)}
.dr-peek{font:inherit;font-weight:800;background:#facc15;border-radius:99px;padding:2px 10px;margin-top:4px;font-size:13px}
.dr-panel,.sn-panel{background:#fff;border-radius:18px;padding:10px;box-shadow:0 5px 0 #c9cff5;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.dr-wrap:not(.land) .dr-panel,.sn-wrap:not(.land) .sn-panel,.sl-wrap:not(.land) .sl-side{max-height:56cqh}
.dr-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dr-tab{font:inherit;font-weight:800;padding:4px 12px;border-radius:99px;background:#eef1ff;font-size:clamp(12px,3.2cqmin,16px)}
.dr-tab.sel{background:#6366f1;color:#fff}
.dr-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.dr-sw{width:clamp(30px,7cqmin,44px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #c9cff5}
.dr-sw.sel{box-shadow:0 0 0 4px #1d2350;transform:scale(1.1)}
.dr-st{font:inherit;font-weight:700;padding:5px 10px;border-radius:12px;background:#f1f5f9;font-size:clamp(12px,3.2cqmin,16px)}
.dr-st.sel{background:#ec4899;color:#fff}
.dr-done,.sn-go{align-self:center;font-size:clamp(15px,4cqmin,22px)!important;padding:6px 24px!important}
.sn-model{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(30px,9cqmin,64px);line-height:1.15;background:linear-gradient(#fff,#fce7f3);border-radius:20px;box-shadow:0 5px 0 #f9a8d4;position:relative;min-height:0;padding:8px;overflow:hidden}
.sn-extra{position:absolute;inset-inline-start:12%;top:42%}
.sn-theme{font-weight:800;text-align:center;font-size:clamp(15px,4.2cqmin,22px)}
.sn-theme span{font-size:1.5em;vertical-align:middle}
.sn-row{display:flex;align-items:center;gap:8px}
.sn-row small{font-weight:800;color:#555b85;min-width:66px;font-size:clamp(11px,3cqmin,14px)}
.sn-row>div{display:flex;gap:6px;flex-wrap:wrap}
.sn-i{font-size:clamp(20px,5.6cqmin,32px);width:1.6em;height:1.6em;border-radius:12px;background:#f1f5f9;display:grid;place-items:center}
.sn-i.sel{background:#fbcfe8;outline:3px solid #ec4899}
.sn-i.good{background:#bbf7d0;outline-color:#16a34a}
.sn-i.bad{background:#fecaca;outline-color:#dc2626}
.sl-chair{display:grid;place-items:center;background:radial-gradient(circle,#fff 0,#fce7f3 70%);border-radius:24px;min-height:0;padding:8px;height:100%;box-sizing:border-box}
.sl-doll{width:100%;height:100%;display:grid;place-items:center;min-height:0}
.sl-doll svg{height:100%;width:100%}
.sl-side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.sl-order{background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 0 #c9cff5;text-align:center}
.sl-order small,.sl-pick small{font-weight:800;color:#555b85}
.sl-order>div{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px}
.sl-st{font-size:clamp(20px,5.6cqmin,32px);padding:2px 6px;border-radius:12px;background:#f1f5f9;display:inline-flex;align-items:center;gap:3px;opacity:.75}
.sl-st i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #94a3b8}
.sl-st b{font-size:.7em}
.sl-st.now{background:#fde68a;opacity:1;outline:3px solid #f59e0b}
.sl-st.ok{background:#bbf7d0;opacity:1}
.sl-order em{font-style:normal;color:#94a3b8}
.sl-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.sl-tool{background:#fff;border-radius:14px;box-shadow:0 4px 0 #c9cff5;padding:4px;display:flex;flex-direction:column;align-items:center}
.sl-tool:active{transform:translateY(3px)}
.sl-tool span{font-size:clamp(22px,6cqmin,34px)}
.sl-tool small{font-weight:700;font-size:12px}
.sl-pick{text-align:center}
.sl-pick>div{display:flex;gap:8px;justify-content:center;margin-top:4px}
.sl-pv{width:46px;height:46px;border-radius:50%;font-size:26px;background:#fff;box-shadow:0 3px 0 #c9cff5;border:3px solid #fff}
.shake{animation:shake .4s}
.sl-wrap:not(.land){grid-template-rows:minmax(0,1fr) auto}
.sl-wrap:not(.land) .sl-tools{grid-template-columns:repeat(auto-fit,minmax(54px,1fr))}


/* ================= PRO SKIN: مظهر احترافي لكل الألعاب ================= */
#stage{background:#15163a;color:#fff}
#stage::before{content:"";position:absolute;inset:-50px;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.5)),linear-gradient(180deg,rgba(12,14,40,.55),rgba(12,14,40,.82)),var(--bgimg,linear-gradient(160deg,#4c1d95,#1e3a8a));
  background-size:cover;background-position:center;filter:blur(20px) saturate(1.3);animation:bgdrift 26s ease-in-out infinite alternate}
@keyframes bgdrift{to{transform:scale(1.1) translate(-2%,1.5%)}}
.stage-wrap{background:linear-gradient(145deg,#2a2d6e,#14163a);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 18px 40px rgba(20,22,60,.35)}
/* شريط المعلومات: زجاجي داكن */
.hud .pill:not(.lvl){background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hud .pill b{color:#fde68a}
.hud .lvl{box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
/* النصوص على الخلفية الداكنة */
#stage .q{color:#fff;text-shadow:0 4px 22px rgba(0,0,0,.45)}
#stage .q-hint,#stage .q-hint.rid{color:#e0e7ff}
#stage .big-letter{background:linear-gradient(180deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 18px rgba(167,139,250,.55))}
#stage .q-word{color:#fde68a}
/* أزرار الإجابات: لامعة ثلاثية الأبعاد */
.choice{background:linear-gradient(180deg,#ffffff,#e6e9ff);color:#1d2350;box-shadow:0 6px 0 #8f97d6,0 14px 26px rgba(0,0,0,.3);border:0;transition:transform .12s,box-shadow .12s,filter .12s}
@media (hover:hover){.choice:hover{transform:translateY(-3px);filter:brightness(1.04)}}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #8f97d6,0 6px 12px rgba(0,0,0,.25)}
.choice.ok{background:linear-gradient(180deg,#5eea8f,#16a34a);color:#fff;box-shadow:0 6px 0 #0f6b30,0 0 0 4px rgba(134,239,172,.45),0 0 36px rgba(74,222,128,.85);animation:okpulse .5s ease}
.choice.bad{background:linear-gradient(180deg,#fb8a8a,#dc2626);color:#fff;box-shadow:0 6px 0 #8f1c1c,0 0 26px rgba(248,113,113,.6);animation:shake .4s}
@keyframes okpulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
/* بطاقات الذاكرة */
.mem-card .f{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 45%),repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px),linear-gradient(145deg,#7c5cff,#3b1fd1);color:#fde047;text-shadow:0 0 14px rgba(253,224,71,.8);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 8px 18px rgba(0,0,0,.35)}
.mem-card .bk{background:linear-gradient(180deg,#fff,#eef1ff);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.mem-card.ok .bk{background:linear-gradient(180deg,#ecfdf3,#bbf7d0);box-shadow:0 0 0 3px #4ade80,0 0 28px rgba(74,222,128,.8)}
/* إكس أو: خانات زجاجية */
.cell{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 10px 22px rgba(0,0,0,.28);transition:background .15s,transform .12s}
@media (hover:hover){.cell:hover{background:rgba(255,255,255,.2)}}
.cell.on{filter:drop-shadow(0 0 12px rgba(255,255,255,.35))}
.cell.win{background:rgba(250,204,21,.22);border-color:#facc15;box-shadow:0 0 0 2px #facc15,0 0 34px rgba(250,204,21,.75)}
/* تذكّر الألوان: أزرار لامعة */
.pad{position:relative;overflow:hidden;opacity:.55;box-shadow:inset 0 -10px 0 rgba(0,0,0,.22),0 10px 22px rgba(0,0,0,.35)}
.pad::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),transparent 42%);pointer-events:none}
.pad.lit{opacity:1;box-shadow:0 0 0 4px rgba(255,255,255,.75),0 0 50px 12px rgba(255,255,255,.45);filter:brightness(1.3) saturate(1.2)}
/* اضرب الخلد */
.hole{box-shadow:0 10px 24px rgba(0,0,0,.35)}
/* فرز الألوان: أنابيب زجاجية وكرات ثلاثية الأبعاد */
.st-t{border:0;border-radius:0 0 36px 36px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.07) 28%,rgba(255,255,255,.03) 70%,rgba(255,255,255,.22));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 8px 0 10px -4px rgba(255,255,255,.35),0 14px 28px rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);position:relative;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.st-t::before{content:"";position:absolute;top:-6px;left:-6px;right:-6px;height:10px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.35));box-shadow:0 2px 6px rgba(0,0,0,.25)}
.st-t i{width:auto!important;height:calc((100% - 22px) / 4);aspect-ratio:1;max-width:92%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.45) 15%,transparent 38%),radial-gradient(circle at 62% 78%,rgba(0,0,0,.38),transparent 62%),var(--c,#888);
  box-shadow:inset -3px -5px 9px rgba(0,0,0,.35),inset 2px 3px 6px rgba(255,255,255,.25),0 5px 8px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.st-t i.up{transform:translateY(-34px) scale(1.06);filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
.st-t i.drop{animation:balldrop .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes balldrop{from{transform:translateY(-70px)}60%{transform:translateY(4px) scaleY(.9)}}
.st-t.sel{transform:translateY(-8px)}
.st-t.ok{background:linear-gradient(90deg,rgba(134,239,172,.45),rgba(74,222,128,.15) 30%,rgba(74,222,128,.1) 70%,rgba(134,239,172,.4));box-shadow:inset 0 0 0 3px #86efac,0 0 34px rgba(74,222,128,.75),0 14px 28px rgba(0,0,0,.35)}
.st-t.kb{outline:3px dashed #a5b4fc}
/* طبقة المؤثرات + اهتزاز عند الخطأ */
.fx-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:26}
.stage-wrap.hit-bad #stage{animation:stshake .32s}
@keyframes stshake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.stage-wrap.hit-bad #stage .body{box-shadow:inset 0 0 60px rgba(239,68,68,.35);border-radius:18px}

/* ألغاز الصور */
.jg-wrap{display:flex;align-items:center;justify-content:center;gap:3cqmin;width:100%;height:100%}
.jg-board{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:4px;width:min(70cqw,calc(100cqh - var(--hud,58px) - 60px));aspect-ratio:1;padding:6px;border-radius:18px;background:rgba(255,255,255,.12);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.2)}
.jg-t{border:0;border-radius:10px;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.35);transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
@media (hover:hover){.jg-t:hover{transform:scale(1.04)}}
.jg-t.sel{transform:scale(.9);box-shadow:0 0 0 4px #facc15,0 0 26px rgba(250,204,21,.8)}
.jg-t.ok{box-shadow:inset 0 0 0 2px rgba(134,239,172,.9),0 0 14px rgba(74,222,128,.5)}
.jg-prev{display:flex;flex-direction:column;align-items:center;gap:6px;color:#e0e7ff;font-weight:700;font-size:13px}
.jg-prev img{width:min(22cqw,150px);aspect-ratio:1;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.4);object-fit:cover}
@container (max-aspect-ratio:1/1){.jg-wrap{flex-direction:column-reverse}.jg-board{width:min(90cqw,calc(100cqh - var(--hud,58px) - 150px))}.jg-prev img{width:min(18cqh,110px)}}
/* دفتر التلوين */
.cl-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqmin;width:100%;height:100%}
.cl-board{display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);gap:2px;aspect-ratio:var(--c)/var(--r);height:min(calc(100cqh - var(--hud,58px) - 130px),calc(88cqw * var(--r) / var(--c)));padding:8px;border-radius:16px;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.4);touch-action:none}
.cl-c{display:grid;place-items:center;border-radius:4px;background:#e5e7eb;color:#6b7280;font-weight:800;font-size:min(calc(46cqh / var(--r)),22px);cursor:pointer;user-select:none;transition:transform .1s}
.cl-c.bg{background:transparent;cursor:default}
.cl-c.f{animation:pop .25s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.35)}
.cl-c.bad{animation:shake .35s;background:#fecaca}
.cl-pal{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cl-sw{width:clamp(44px,9cqmin,62px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),transparent 40%),var(--sw);box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.cl-sw b{background:rgba(255,255,255,.85);color:#1d2350;border-radius:99px;min-width:24px;font-size:14px;padding:0 6px}
.cl-sw.sel{transform:scale(1.18);box-shadow:0 0 0 4px #fff,0 0 22px rgba(255,255,255,.7)}
.cl-sw.done{opacity:.45}.cl-sw.done b::after{content:" ✓"}
/* مطبخ الصغار */
.kt-wrap{display:grid;grid-template-columns:1fr;justify-items:center;align-content:center;gap:1.8cqmin;width:100%;height:100%}
.kt-order{display:flex;align-items:center;gap:12px}
.kt-cust{font-size:clamp(44px,11cqmin,74px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.kt-bub{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 8px 20px rgba(0,0,0,.35);max-width:min(70cqw,520px)}
.kt-it{display:flex;align-items:center;gap:3px;font-size:clamp(22px,5.5cqmin,34px);color:#1d2350;padding:2px 8px;border-radius:12px;background:#f1f5f9}
.kt-it b{font-size:.55em}.kt-it i{font-style:normal;font-size:.45em;color:#64748b;margin-inline-start:4px}
.kt-it.ok{background:#bbf7d0}
.kt-pizza{width:min(44cqmin,320px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fcd34d,#d97706 70%,#92400e);padding:7%;box-shadow:0 16px 34px rgba(0,0,0,.45)}
.kt-base{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f87171,#dc2626 75%);box-shadow:inset 0 0 0 6px rgba(253,230,138,.7)}
.kt-top{position:absolute;transform:translate(-50%,-50%);font-size:min(7cqmin,40px);animation:pop .25s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.kt-tops{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kt-tb{font-size:clamp(26px,6cqmin,40px);width:clamp(50px,11cqmin,68px);aspect-ratio:1;border-radius:16px;border:0;background:linear-gradient(180deg,#fff,#e6e9ff);box-shadow:0 5px 0 #8f97d6,0 10px 18px rgba(0,0,0,.3);cursor:pointer}
.kt-tb:active{transform:translateY(3px);box-shadow:0 2px 0 #8f97d6}
.kt-acts{display:flex;gap:10px}
.kt-acts .play-btn{font-size:clamp(15px,4cqmin,20px);padding:6px 20px}

/* ===== ألعاب الذكاء والتركيز ===== */
.br-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2.6cqmin,2.2cqh);width:100%;height:100%}
.br-area.br-in{animation:brin .35s ease-out}
@keyframes brin{from{opacity:.2;transform:translateY(10px)}}
.br-msg{font-weight:800;font-size:clamp(17px,4.4cqmin,28px);color:#fff;text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.45)}
.br-tm{width:min(80cqw,520px);height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.br-tm i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);animation:brtm var(--t) linear forwards;transform-origin:right}
@keyframes brtm{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#stage.paused .br-tm i{animation-play-state:paused}
/* مصفوفة */
.mx{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:min(1.6cqmin,10px);width:min(80cqw,calc(100cqh - var(--hud,58px) - 90px));aspect-ratio:1}
.mx-c{border:0;border-radius:min(2.4cqmin,16px);background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.25);cursor:pointer;transition:background .2s,transform .15s}
@media (hover:hover){.mx-c:hover{background:rgba(255,255,255,.2)}}
.mx-c.on,.mx-c.hit{background:linear-gradient(145deg,#5eead4,#14b8a6);box-shadow:0 0 0 2px #99f6e4,0 0 26px rgba(45,212,191,.75);transform:scale(1.03)}
.mx-c.hit{animation:okpulse .4s}
.mx-c.miss{background:linear-gradient(145deg,#fca5a5,#dc2626);animation:shake .35s}
.mx-c.reveal{background:rgba(94,234,212,.35);box-shadow:inset 0 0 0 3px #5eead4}
/* بطاقات كلمة / شكل */
.st-card,.nb-card{min-width:min(70cqw,420px);padding:min(5cqmin,34px) 20px;border-radius:26px;background:linear-gradient(180deg,#fff,#eef1ff);box-shadow:0 10px 0 #8f97d6,0 22px 40px rgba(0,0,0,.4);text-align:center;font-weight:800;font-size:clamp(46px,14cqmin,104px);line-height:1.15}
.nb-card{min-width:0;width:min(42cqmin,260px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(70px,22cqmin,150px);padding:0;animation:cardin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardin{from{transform:translateX(-40px) rotate(-6deg);opacity:.2}}
.yn{display:flex;gap:14px}
.yn-b{min-width:clamp(120px,24cqw,200px);padding:10px 18px;border:0;border-radius:18px;font:inherit;font-weight:800;font-size:clamp(20px,5cqmin,30px);color:#fff;cursor:pointer;transition:transform .1s}
.yn-b.yes{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 6px 0 #0f6b30,0 12px 22px rgba(0,0,0,.3)}
.yn-b.no{background:linear-gradient(#f87171,#dc2626);box-shadow:0 6px 0 #8f1c1c,0 12px 22px rgba(0,0,0,.3)}
.yn-b:active{transform:translateY(4px)}
.yn-b.ok{box-shadow:0 0 0 4px #fff,0 0 34px rgba(255,255,255,.8);animation:okpulse .4s}
.yn-b.bad{filter:grayscale(.6);animation:shake .35s}
.yn-b:disabled{opacity:.35}
/* العدّ */
.cn-box{position:relative;width:min(84cqw,640px);height:min(46cqh,360px);border-radius:24px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=s=>{const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('marah:'+k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem('marah:'+k,JSON.stringify(v))}catch{}}};
function toast(msg){document.querySelector('.toast')?.remove();const t=h(`<div class="toast">${msg}</div>`);document.body.append(t);setTimeout(()=>t.remove(),1800)}

/* ---------- sound ---------- */
const sound={on:store.get('sound',true)};let actx;
function beep(f=600,d=.12,type='sine',v=.15){if(!sound.on)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const sfx={good(){beep(660,.1);setTimeout(()=>beep(880,.15),90)},bad(){beep(170,.25,'square',.07)},pop(){beep(900,.06,'triangle')},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*120))}};
let arVoice=null;const pickVoice=()=>{const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar[-_]SA/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null};
if('speechSynthesis' in window){pickVoice();speechSynthesis.addEventListener?.('voiceschanged',pickVoice)}
function speak(w){if(!sound.on||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(w);u.lang='ar-SA';if(arVoice)u.voice=arVoice;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}

/* ---------- difficulty & stages ---------- */
const DIFFS=[
  {t:'سهل',e:'🌱',a:'#4ade80',b:'#16a34a',s:'#0f7a35'},
  {t:'وسط',e:'🔥',a:'#fdba74',b:'#f97316',s:'#c2410c'},
  {t:'صعب',e:'🚀',a:'#f87171',b:'#dc2626',s:'#991b1b'},
];
const STAGES=10, LEVELS=DIFFS.length*STAGES; /* 30 درجة صعوبة متصلة: سهل 1-10، وسط 11-20، صعب 21-30 */
const unl=(id,d)=>store.get(`unl:${id}:${d}`,1);          // أعلى مرحلة مفتوحة
const isDone=(id,d)=>store.get(`fin:${id}:${d}`,false);   // أنهى المرحلة 10 بعلامة كاملة

/* ---------- game context (auto cleanup + pause) ---------- */
function makeCtx(g,run){const T=[],I=[],L=[];const D=DIFFS[run.diff],lv=run.diff*STAGES+run.stage-1,t=lv/(LEVELS-1);let over=false;
  const c={run,lv,t,f:(a,b)=>a+(b-a)*t,fi:(a,b)=>Math.round(a+(b-a)*t),paused:false,resumeFns:[],
  tag:run.practice?'':`<button class="pill lvl" data-lvl title="المستوى والمراحل" aria-label="تغيير المستوى أو المرحلة" style="--a:${D.a};--b:${D.b}">${D.e} ${D.t} · مرحلة ${run.stage}/${STAGES} <span class="chev">▾</span></button>`,
  every(f,ms){const id=setInterval(()=>{if(!c.paused)f()},ms);I.push(id);return id},
  after(f,ms){const run2=()=>{if(c.paused){T.push(setTimeout(run2,150));return}f()};const id=setTimeout(run2,ms);T.push(id);return id},
  on(t2,e,f,o){t2.addEventListener(e,f,o);L.push([t2,e,f,o])},
  timeBar(root,sec,onEnd){const bar=h('<div class="tbar" role="progressbar" aria-label="الوقت المتبقي"><i></i></div>');root.append(bar);const fill=bar.firstElementChild;
    let end=performance.now()+sec*1000;c.resumeFns.push(dt=>{end+=dt});const left=()=>Math.max(0,(end-performance.now())/1000);
    c.every(()=>{const p=left()/sec;fill.style.width=(p*100)+'%';bar.classList.toggle('low',p<=.3);if(p<=0)onEnd()},100);return{left}},
  pause(){if(c.paused)return;c.paused=true;c._ps=performance.now();$('#stage').classList.add('paused')},
  resume(){if(!c.paused)return;c.paused=false;$('#stage').classList.remove('paused');const dt=performance.now()-c._ps;c.resumeFns.forEach(f=>f(dt))},
  clear(){T.forEach(clearTimeout);I.forEach(clearInterval);L.forEach(([t2,e,f,o])=>t2.removeEventListener(e,f,o));T.length=I.length=L.length=0},
  win(score,msg,res){if(over)return;over=true;c.clear();if(run.practice)return practiceEnded(g,run,'win');stageDone(g,run,Math.max(0,Math.round(score)),msg,res)},
  lose(msg,res){if(over)return;over=true;c.clear();if(run.practice)return practiceEnded(g,run,'lose');gameOver(g,run,msg,res)}};
  return c}
function fitHud(){const st=$('#stage'),hd=st.querySelector('.hud');st.style.setProperty('--hud',(hd?hd.offsetHeight+18:58)+'px')}

/* ---------- GAMES (كل لعبة تتدرج مع c.t من 0 إلى 1 عبر 30 درجة) ---------- */
const G={};
const MEM={animals:['🐶','🐱','🐰','🦊','🐼','🐸','🐵','🦁','🐯','🐨','🐷','🐮'],fruits:['🍎','🍌','🍇','🍓','🍉','🍍','🥝','🍒','🍑','🥭','🍋','🍐'],space:['🚀','🌍','🌙','⭐','🪐','☄️','👽','🛸','🌞','🔭','👨‍🚀','🌌']};
const MEMGRID={3:[3,2],4:[4,2],6:[4,3],8:[4,4],10:[5,4],12:[6,4]};
G.memory=(theme,boost=0)=>(root,c)=>{
  const L=Math.min(LEVELS-1,c.lv+boost),tt=L/(LEVELS-1),lerp=(a,b)=>a+(b-a)*tt;
  const n=[3,4,6,8,10,12][Math.min(5,Math.floor(tt*6))],[cols,rows]=MEMGRID[n],set=shuffle(MEM[theme]).slice(0,n);
  const peek=Math.max(0,Math.round(lerp(3000,-600))),back=Math.round(lerp(1200,450)),limit=L>=10?Math.round(n*lerp(3.6,2.1)):0;
  let open=[],done=0,moves=0,lock=true;
  root.innerHTML=`<div class="hud">${c.tag}<span class="pill">🔁 <b class="mv">0</b>${limit?` من ${limit}`:''}</span><span class="pill">✅ <b class="dn">0</b> من ${n}</span></div><div class="body"><div class="mem-grid" style="--cols:${cols};--rows:${rows}"></div></div>`;
  const grid=root.querySelector('.mem-grid'),mv=root.querySelector('.mv'),dn=root.querySelector('.dn');
  const cards=shuffle([...set,...set]).map(e=>{
    const b=h(`<button class="mem-card" data-e="${e}" aria-label="بطاقة"><span class="f">★</span><span class="bk">${e}</span></button>`);
    b.onclick=()=>{if(lock||b.classList.contains('flip'))return;sfx.pop();b.classList.add('flip');open.push(b);
      if(open.length<2)return;moves++;mv.textContent=moves;const[a,d]=open;open=[];
      if(a.dataset.e===d.dataset.e){a.classList.add('ok');d.classList.add('ok');done++;dn.textContent=done;sfx.good();
        if(done===n)return c.after(()=>c.win(n*10+Math.max(0,(limit||n*3)-moves)*2,`وجدت كل الأزواج (عدد الحركات: ${moves})`,{got:n,total:n,perfect:true,label:'الأزواج'}),500)}
      else{lock=true;c.after(()=>{a.classList.remove('flip');d.classList.remove('flip');lock=false},back)}
      if(limit&&moves>=limit&&done<n)c.after(()=>c.lose('انتهت الحركات!',{got:done,total:n,label:'الأزواج'}),600)};
    grid.append(b);return b});
  if(peek>0){cards.forEach(b=>b.classList.add('flip'));c.after(()=>{cards.forEach(b=>b.classList.remove('flip'));lock=false},peek)}else lock=false;
};

G.ttt=(root,c)=>{
  const rand=Math.max(0,c.f(.65,-.05)),smart=c.lv>=8,need=c.lv<20?2:3,compStarts=c.lv>=12;let b=Array(9).fill(''),busy=false,sx=0,so=0,round=1;
  root.innerHTML=`<div class="hud">${c.tag}<span class="pill">😀 ❌ <b class="sx">0</b> من ${need}</span><span class="pill">🤖 ⭕ <b class="so">0</b></span><span class="pill msg">دورك!</span></div><div class="body"><div class="ttt"></div></div>`;
  const grid=root.querySelector('.ttt'),msg=t=>root.querySelector('.msg').textContent=t;
  const cells=[...Array(9)].map((_,i)=>{const d=h(`<button class="cell" aria-label="خانة ${i+1}"></button>`);d.onclick=()=>move(i);grid.append(d);return d});
  const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const line=(bb,p)=>WL.find(l=>l.every(i=>bb[i]===p));
  const empt=bb=>bb.map((v,i)=>v?-1:i).filter(i=>i>=0);
  function mm(bb,p){if(line(bb,'o'))return{s:10};if(line(bb,'x'))return{s:-10};const e=empt(bb);if(!e.length)return{s:0};let best=null;
    for(const i of e){bb[i]=p;const s=mm(bb,p==='o'?'x':'o').s*.9;bb[i]='';if(!best||(p==='o'?s>best.s:s<best.s))best={s,i}}return best}
  function ai(){const e=empt(b);if(Math.random()<rand)return e[rnd(0,e.length-1)];if(smart)return mm(b,'o').i;
    for(const p of['o','x'])for(const i of e){b[i]=p;const w=line(b,p);b[i]='';if(w)return i}return !b[4]?4:e[rnd(0,e.length-1)]}
  const put=(i,p)=>{b[i]=p;cells[i].textContent=p==='x'?'❌':'⭕';cells[i].classList.add('on')};
  function check(){
    for(const p of['x','o']){const l=line(b,p);if(l){l.forEach(i=>cells[i].classList.add('win'));
      if(p==='x'){sx++;root.querySelector('.sx').textContent=sx;sfx.good();msg('🎉 فزت بالجولة!')}else{so++;root.querySelector('.so').textContent=so;sfx.bad();msg('🤖 فاز الكمبيوتر')}
      return roundOver()}}
    if(!empt(b).length){msg('🤝 تعادل');return roundOver()}return false}
  function roundOver(){busy=true;c.after(()=>{
    if(sx===need)return c.win(sx*15+(need-so)*10,'فزت على الكمبيوتر! 🏆',{got:sx,total:need,perfect:true,label:'جولات الفوز'});
    if(so===need)return c.lose(`الكمبيوتر فاز بـ ${need} جولات`,{got:sx,total:need,label:'جولات الفوز'});
    b=Array(9).fill('');cells.forEach(x=>{x.textContent='';x.className='cell'});round++;
    if(compStarts&&round%2===0){msg('🤖 يبدأ...');c.after(()=>{put(ai(),'o');busy=false;msg('دورك!')},500)}else{busy=false;msg('دورك!')}},1300);return true}
  function move(i){if(busy||b[i])return;put(i,'x');sfx.pop();if(check())return;busy=true;msg('🤖 يفكر...');
    c.after(()=>{put(ai(),'o');beep(420,.08);busy=false;if(!check())msg('دورك!')},550)}
};

G.snake=(root,c)=>{
  const N=c.fi(12,18),speed=Math.round(c.f(250,95)),goal=c.fi(4,16),nRocks=c.lv<5?0:c.fi(-2,14),wrap=c.lv<6;
  root.innerHTML=`<div class="hud">${c.tag}<span class="pill">🍎 <b class="sc">0</b> من ${goal}</span><span class="pill hint">👆 اضغط سهماً للبدء</span></div><div class="body snake-body"><canvas></canvas><div class="dpad"><button data-d="u">⬆️</button><button data-d="l">⬅️</button><button data-d="d">⬇️</button><button data-d="r">➡️</button></div></div>`;
  const body=root.querySelector('.body'),cv=root.querySelector('canvas'),x=cv.getContext('2d'),dpad=root.querySelector('.dpad');
  const coarse=matchMedia('(pointer:coarse)').matches;if(!coarse)dpad.hidden=true;
  const my=N>>1;let started=false,u=20,sn=[{x:3,y:my},{x:2,y:my},{x:1,y:my}],dir={x:1,y:0},nd=dir,score=0;
  const occ=(p,arr)=>arr.some(s=>s.x===p.x&&s.y===p.y);
  const rocks=[];while(rocks.length<nRocks){const p={x:rnd(1,N-2),y:rnd(1,N-2)};if(Math.abs(p.y-my)>1&&!occ(p,rocks))rocks.push(p)}
  let food=place();
  function place(){let p;do{p={x:rnd(0,N-1),y:rnd(0,N-1)}}while(occ(p,sn)||occ(p,rocks));return p}
  function size(){const r=body.getBoundingClientRect();const wide=r.width>r.height*1.3;body.style.flexDirection=wide?'row':'column';
    const s=Math.max(160,Math.floor(Math.min(r.width-(coarse&&wide?200:0),r.height-(coarse&&!wide?136:0))));
    const dpr=devicePixelRatio||1;cv.style.width=cv.style.height=s+'px';cv.width=cv.height=Math.round(s*dpr);u=cv.width/N;draw()}
  function draw(){const B=N*u;const bg=x.createLinearGradient(0,0,B,B);bg.addColorStop(0,'#2f9e5b');bg.addColorStop(1,'#1f7a45');x.fillStyle=bg;x.fillRect(0,0,B,B);
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2){x.fillStyle='rgba(255,255,255,.06)';x.fillRect(i*u,j*u,u,u)}
    const vg=x.createRadialGradient(B/2,B/2,B*.3,B/2,B/2,B*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.28)');x.fillStyle=vg;x.fillRect(0,0,B,B);
    x.font=`${u*.85}px serif`;x.textAlign='center';x.textBaseline='middle';
    rocks.forEach(r=>{x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(r.x*u+u/2,r.y*u+u*.85,u*.38,u*.12,0,0,7);x.fill();x.fillText('🪨',r.x*u+u/2,r.y*u+u/2+u*.05)});
    const fx0=food.x*u+u/2,fy0=food.y*u+u/2,pul=1+Math.sin(performance.now()/180)*.08,gl=x.createRadialGradient(fx0,fy0,0,fx0,fy0,u*.9);gl.addColorStop(0,'rgba(255,230,120,.7)');gl.addColorStop(1,'rgba(255,230,120,0)');
    x.fillStyle=gl;x.beginPath();x.arc(fx0,fy0,u*.9*pul,0,7);x.fill();x.font=`${u*.9*pul}px serif`;x.fillText('🍎',fx0,fy0+u*.05);
    const P=sn.map(s=>[s.x*u+u/2,s.y*u+u/2]);x.lineCap='round';x.lineJoin='round';
    const path=(ox,oy)=>{x.beginPath();P.forEach(([a,b2],i)=>{if(i&&Math.hypot(a-P[i-1][0],b2-P[i-1][1])>u*1.5)x.moveTo(a+ox,b2+oy);else i?x.lineTo(a+ox,b2+oy):x.moveTo(a+ox,b2+oy)});x.stroke()};
    x.strokeStyle='rgba(0,0,0,.28)';x.lineWidth=u*.8;path(0,u*.1);
    const sg=x.createLinearGradient(P[0][0],P[0][1],P[P.length-1][0],P[P.length-1][1]);sg.addColorStop(0,'#7c3aed');sg.addColorStop(1,'#db2777');x.strokeStyle=sg;x.lineWidth=u*.78;path(0,0);
    x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=u*.26;path(-u*.08,-u*.1);
    const [hx,hy]=P[0],hg=x.createRadialGradient(hx-u*.15,hy-u*.18,u*.05,hx,hy,u*.55);hg.addColorStop(0,'#c4b5fd');hg.addColorStop(1,'#5b21b6');x.fillStyle=hg;x.beginPath();x.arc(hx,hy,u*.5,0,7);x.fill();
    const ex=-dir.y,ey=dir.x;[[1],[-1]].forEach(([sgn])=>{const cx=hx+dir.x*u*.16+ex*sgn*u*.2,cy=hy+dir.y*u*.16+ey*sgn*u*.2;x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,u*.15,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(cx+dir.x*u*.05,cy+dir.y*u*.05,u*.075,0,7);x.fill()})}
  function turn(dx,dy){if(!started){started=true;root.querySelector('.hint').textContent=wrap?'🌀 تستطيع العبور من الجدار':'⚠️ احذر الجدار والصخور'}if(dx===-dir.x&&dy===-dir.y)return;nd={x:dx,y:dy}}
  function step(){if(!started)return;dir=nd;let hd={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(wrap)hd={x:(hd.x+N)%N,y:(hd.y+N)%N};
    if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||occ(hd,sn)||occ(hd,rocks)){sfx.bad();return c.lose('اصطدم الثعبان!',{got:score,total:goal,label:'التفاح'})}
    sn.unshift(hd);if(hd.x===food.x&&hd.y===food.y){score++;root.querySelector('.sc').textContent=score;{const cr=cv.getBoundingClientRect(),q=cr.width/N;FX.lastTap={x:cr.left+(food.x+.5)*q,y:cr.top+(food.y+.5)*q,t:performance.now()}}sfx.good();
      if(score>=goal){draw();return c.win(score*10,'أكلت كل التفاح! 🍎',{got:score,total:goal,perfect:true,label:'التفاح'})}food=place()}else sn.pop();draw()}
  const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};

  const D={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};dpad.querySelectorAll('button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();turn(...D[b.dataset.d])});

  c.on(window,'resize',size);requestAnimationFrame(size);c.every(step,speed);c.every(()=>{if(!started)draw()},120);
};

G.simon=(root,c)=>{

/* 3+5) محرك القيادة الجانبية — القيادة المجنونة (Drive Mad) وتسلق التلال (Hill Climb Racing) */

    else if(r<.5){const hh=rnd(amp*.3,amp)*(Math.random()<.75?1:-.7);hump(Math.max(rnd(260,600),Math.abs(hh)*5),hh)}

  flat(700);const FIN=T.length*ST-500;
  const gr=X=>{const i=X/ST,i0=Math.floor(i);if(i0<0)return T[0];if(i0>=T.length-1)return T[T.length-1];const a=T[i0],b=T[i0+1];if(a!==a||b!==b)return 1e6;return a+(b-a)*(i-i0)};

  const A=arena(root,c,{W,H,hud:`<span class="pill">🏁 <b class="pr">0</b>%</span><span class="pill lv2">${'❤️'.repeat(lives)}</span>${hill?'<span class="pill">⛽ <b class="fu">100</b>%</span>':''}<span class="pill">🪙 <b class="co">0</b></span>`,
    pads:[{k:'ArrowLeft',l:'🛑',side:'l',big:1,a:'فرامل'},{k:'ArrowRight',l:'⛽',side:'r',big:1,a:'بنزين'}]});

    for(let it=0;it<3;it++){const dx=w2.x-w1.x,dy=w2.y-w1.y,d=Math.hypot(dx,dy)||1,k=(d-LEN)/d/2;w1.x+=dx*k;w1.y+=dy*k;w2.x-=dx*k;w2.y-=dy*k;if(collide(w1))w1.on=true;if(collide(w2))w2.on=true}

/* 23) عرض الأزياء — مستوحاة من Super Dress */
G.runway=(root,c)=>{
  const W=480,H=800,N=c.fi(8,20),sp=c.f(250,470),cols=shuffle(PAL.slice(0,7)).slice(0,c.lv<10?2:3),tc=cols[0],CL=['👗','👚','👒','👠','👜','🧣','🎀','👟'];
  let lane=1,px=240,rows=[],spawned=0,got=0,bad=0,t=0,fx=[];const lanes=[110,240,370];
  const A=arena(root,c,{W,H,hud:`<span class="pill">🎯 اجمع اللون <b style="color:${tc[1]}">${tc[0]}</b></span><span class="pill">✅ <b class="gt">0</b> من ${N}</span><span class="pill">❌ <b class="bd">0</b></span>`,
    onDown:p=>{lane=clamp(lane+(p.x<W/2?-1:1),0,2);beep(600,.03,'triangle',.05)},onKey:k=>{if(k==='ArrowLeft'||k==='KeyA')lane=Math.max(0,lane-1);if(k==='ArrowRight'||k==='KeyD')lane=Math.min(2,lane+1)}});
  const res=()=>({got,total:N,label:`قطع باللون ${tc[0]}`});
  A.loop(dt=>{const x=A.x;t+=dt;px+=(lanes[lane]-px)*Math.min(1,dt*14);
    if(spawned<N&&(!rows.length||rows[rows.length-1].y>220)){const tl=rnd(0,2),others=shuffle([0,1,2].filter(l=>l!==tl)).slice(0,c.lv<6?1:rnd(1,2));
      rows.push({y:-60,items:[{l:tl,col:tc,e:CL[rnd(0,7)]},...others.map(l=>({l,col:cols[rnd(1,cols.length-1)],e:CL[rnd(0,7)]}))]});spawned++}
    rows.forEach(r=>{r.y+=sp*dt;if(!r.done&&r.y>640){r.done=1;const it=r.items.find(i=>i.l===lane);if(it){if(it.col===tc){got++;sfx.good();fx.push({t:1,s:'✨'})}else{bad++;sfx.bad();fx.push({t:1,s:'❌'})}it.hit=1;A.set('.gt',got);A.set('.bd',bad)}}});
    rows=rows.filter(r=>r.y<H+80);
    if(spawned>=N&&!rows.length)return got===N&&bad===0?A.win(got*10,'إطلالة مثالية على المنصة! 💃✨',{...res(),perfect:true}):got>=N*.6?A.win(got*10-bad*5,`جمعت ${got} وأخطأت في ${bad}`,res()):A.lose('إطلالة غير مكتملة',res());
    x.fillStyle='#fdf2f8';x.fillRect(0,0,W,H);x.fillStyle='#fbcfe8';x.fillRect(40,0,400,H);x.fillStyle='#f9a8d4';for(let y=(t*sp)%100-100;y<H;y+=100){x.fillRect(172,y,6,50);x.fillRect(302,y,6,50)}
    for(let y=(t*sp*.9)%120-120;y<H;y+=120){emo(x,'💡',18,y,22);emo(x,'💡',462,y+60,22)}
    rows.forEach(r=>r.items.forEach(it=>{if(it.hit)return;x.fillStyle=it.col[1];x.beginPath();x.arc(lanes[it.l],r.y,40,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.stroke();emo(x,it.e,lanes[it.l],r.y,40)}));
    const k=got/N;x.fillStyle=tc[1];x.globalAlpha=.25+k*.75;x.beginPath();x.moveTo(px-30,690);x.lineTo(px+30,690);x.lineTo(px+44,760);x.lineTo(px-44,760);x.fill();x.globalAlpha=1;emo(x,'👧',px,660,70);
    fx=fx.filter(f=>(f.t-=dt*1.5)>0);fx.forEach(f=>emo(x,f.s,px,600-(1-f.t)*60,40*f.t+10));
    hintTxt(A,x,isTouch()?'المس يمين أو يسار الشاشة لتغيّر المسار':'⬅️ ➡️ لتغيير المسار')});
};

const TOOLS=[['wash','🧴','غسيل'],['comb','🪮','تمشيط'],['dry','💨','تجفيف'],['color','🎨','صبغ'],['acc','🎀','زينة'],['mask','🥒','قناع'],['cut','✂️','قص']];
G.salon=(root,c)=>{
  const nC=c.fi(2,4),pool=TOOLS.slice(0,c.lv<10?5:7),tl=c.lv>=10?Math.round(nC*c.f(30,14)):0;let ci=0,step=0,miss=0,done=0,total=0,order,look,picker=null;
  const custs=[...Array(nC)].map(()=>{let st=shuffle(pool).slice(0,c.fi(2,5)).map(t=>({t:t[0],e:t[1],n:t[2]}));const w=st.findIndex(s=>s.t==='wash'),d=st.findIndex(s=>s.t==='dry');if(w>=0&&d>=0&&d<w)[st[w],st[d]]=[st[d],st[w]];
    st.forEach(s=>{if(s.t==='color')s.v=HCOL[rnd(2,5)];if(s.t==='acc')s.v=['👑','🎀','🌸','👓'][rnd(0,3)]});total+=st.length;return st});
  root.innerHTML=`<div class="hud">${c.tag}<span class="pill">💇 <b class="cn">1</b> من ${nC}</span><span class="pill">❌ <b class="ms">0</b></span></div><div class="body"${tl?' style="bottom:36px"':''}><div class="sl-wrap"><div class="sl-chair"><div class="sl-doll"></div></div><div class="sl-side"><div class="sl-order"></div><div class="sl-tools"></div><div class="sl-pick"></div></div></div></div>`;
  const q=s=>root.querySelector(s),wrap=q('.sl-wrap');
  function newC(){order=custs[ci];step=0;look={skin:SKINS[rnd(0,3)],'hair.s':['long','pony','curly','short'][rnd(0,3)],'hair.c':HCOL[rnd(0,2)],messy:true,acc:'',cut:false};q('.cn').textContent=ci+1;draw()}
  function draw(){q('.sl-doll').innerHTML=doll(look,true);
    q('.sl-order').innerHTML=`<small>طلب الزبونة</small><div>${order.map((s,k)=>`<span class="sl-st${k<step?' ok':k===step?' now':''}">${s.e}${s.v?(s.t==='color'?`<i style="background:${s.v}"></i>`:`<b>${s.v}</b>`):''}</span>`).join('<em>←</em>')}</div>`;
    q('.sl-tools').innerHTML=pool.map(([t,e,n],k)=>`<button class="sl-tool" data-t="${t}"><span>${e}</span><small>${n}</small></button>`).join('');
    q('.sl-tools').querySelectorAll('button').forEach(b=>b.onclick=()=>use(b.dataset.t,b));
    q('.sl-pick').innerHTML=picker?`<small>${picker==='color'?'اختر اللون':'اختر الزينة'}</small><div>${(picker==='color'?HCOL.slice(2):['👑','🎀','🌸','👓']).map(v=>`<button class="sl-pv" data-v="${v}" ${picker==='color'?`style="background:${v}"`:''}>${picker==='color'?'':v}</button>`).join('')}</div>`:'';
    q('.sl-pick').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.v,b))}
  const res=()=>({got:Math.max(0,done-miss),total,label:'خطوات صحيحة'});
  function wrong(el){miss++;q('.ms').textContent=miss;sfx.bad();el?.classList.add('shake');setTimeout(()=>el?.classList.remove('shake'),400)}
  function use(t,el){if(picker||step>=order.length)return;const s=order[step];if(!s||s.t!==t)return wrong(el);if(t==='color'||t==='acc'){picker=t;sfx.pop();return draw()}apply(s)}
  function choose(v,el){const s=order[step];if(!picker||!s)return;if(v!==s.v)return wrong(el);picker=null;apply(s)}
  function apply(s){if(s.t==='wash'){look.bub=true}if(s.t==='dry'){look.bub=false}if(s.t==='comb')look.messy=false;if(s.t==='color')look['hair.c']=s.v;if(s.t==='acc')look.acc=s.v;if(s.t==='mask')look.mask=true;if(s.t==='cut'){look.cut=true;if(look['hair.s']==='long')look['hair.s']='short'}
    step++;done++;sfx.good();if(step>=order.length){look.mask=false;look.bub=false;look.messy=false;look.shine=true;draw();c.after(()=>{ci++;if(ci>=nC)return miss===0?c.win(total*10,'كل الزبونات سعيدات! 💇‍♀️✨',{...res(),perfect:true}):c.win(Math.max(0,total*10-miss*10),`أخطأت ${miss} ${miss>2?'مرات':'مرة'}`,res());newC()},1100)}else draw()}
  c.on(window,'keydown',e=>{if(c.paused)return;const d=e.code.match(/^Digit(\d)$/);if(!d)return;const k=+d[1]-1;if(picker){const b=q('.sl-pick').querySelectorAll('button')[k];b?.click()}else{const b=q('.sl-tools').querySelectorAll('button')[k];b?.click()}});
  function size(){const r=wrap.parentElement.getBoundingClientRect();wrap.classList.toggle('land',r.width>r.height*1.05)}c.on(window,'resize',size);size();
  if(tl)c.timeBar(root,tl,()=>done>=total/2?c.win(done*10,'انتهى الوقت',res()):c.lose('انتهى الوقت',res()));newC();
};

/* ================= ألعاب جديدة: باكمان + الألعاب التي كانت «قريباً» ================= */
const fxPt=(A,X,Y)=>{const r=A.cv.getBoundingClientRect();FX.lastTap={x:r.left+X*A.sc,y:r.top+Y*A.sc,t:performance.now()}};
const TSRC=id=>(window.__T||{})[id]||`thumbs/${id}.webp`;
const PADS4=[{k:'ArrowLeft',l:'⬅️',side:'l'},{k:'ArrowRight',l:'➡️',side:'l'},{k:'ArrowUp',l:'⬆️',side:'r'},{k:'ArrowDown',l:'⬇️',side:'r'}];
const DIRK={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],KeyA:[-1,0],KeyD:[1,0],KeyW:[0,-1],KeyS:[0,1]};
function heartsPill(n){return n>0?'❤️'.repeat(n):'💔'}

/* ---- باكمان ---- */
G.pacman=(root,c)=>{
  const MAP=['#####################','#o........#........o#','#.##.###.#.#.###.##.#','#...................#','#.##.#.#######.#.##.#','#....#....#....#....#','####.### #G# ###.####','#...... GGGGG ......#','####.#.#######.#.####','#.........#.........#','#.##.###.#.#.###.##.#','#o.#......P......#.o#','#.##.#.#######.#.##.#','#....#....#....#....#','#####################'];
  const TS=40,CW=21,RH=15,W=CW*TS,H=RH*TS,wall=(i,j)=>{const r=MAP[j];return !r||r[i]===undefined||r[i]==='#'};
  const dots=new Set(),power=new Set();MAP.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='.'||ch==='o')dots.add(i+','+j);if(ch==='o')power.add(i+','+j)}));
  const total=dots.size,gN=Math.min(4,1+Math.floor(c.lv/7)),pSp=c.f(5,6.6),gSp=c.f(2.6,6.1),smart=c.f(.3,.92),frT=c.f(9,3.5);
  let eaten=0,score=0,lives=c.lv<10?3:c.lv<20?2:1,ready=1.4,waka=0,sw=null;
  const P={x:10,y:11,d:[0,0],nx:[0,0]};const GS=[[10,7],[9,7],[11,7],[10,6]],GC=['#ef4444','#f472b6','#22d3ee','#fb923c'];
  const ghosts=[...Array(gN)].map((_,k)=>({x:GS[k][0],y:GS[k][1],d:[0,-1],col:GC[k],hx:GS[k][0],hy:GS[k][1],delay:1+k*2.2,fr:false,dead:false}));
  const A=arena(root,c,{W,H,pads:PADS4,hud:`<span class="pill">🟡 <b class="dt">0</b> من ${total}</span><span class="pill lv2">${heartsPill(lives)}</span>`,
    onKey:k=>{if(DIRK[k])P.nx=DIRK[k]},onDown:p=>{sw={x:p.x,y:p.y}},onUp:p=>{if(!sw)return;const dx=p.x-sw.x,dy=p.y-sw.y;if(Math.hypot(dx,dy)>20)P.nx=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];sw=null}});
  const res=()=>({got:eaten,total,label:'النقاط'});
  function move(o,sp,dt,choose){let rem=sp*dt,guard=0;
    while(rem>1e-6&&guard++<6){const cx=Math.round(o.x),cy=Math.round(o.y);
      if(Math.abs(o.x-cx)<1e-4&&Math.abs(o.y-cy)<1e-4){o.x=cx;o.y=cy;choose(o,cx,cy);if(!o.d[0]&&!o.d[1])return;if(wall(cx+o.d[0],cy+o.d[1])){o.d=[0,0];return}}
      const tx=o.d[0]>0?Math.floor(o.x+1e-6)+1:o.d[0]<0?Math.ceil(o.x-1e-6)-1:o.x,ty=o.d[1]>0?Math.floor(o.y+1e-6)+1:o.d[1]<0?Math.ceil(o.y-1e-6)-1:o.y;
      const dist=Math.abs(tx-o.x)+Math.abs(ty-o.y);if(rem<dist){o.x+=o.d[0]*rem;o.y+=o.d[1]*rem;rem=0}else{o.x=tx;o.y=ty;rem-=dist}}}
  const pacChoose=(o,cx,cy)=>{if(!wall(cx+P.nx[0],cy+P.nx[1]))o.d=[...P.nx]};
  function ghostChoose(g,cx,cy){const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!wall(cx+d[0],cy+d[1]));let o2=opts.filter(d=>!(d[0]===-g.d[0]&&d[1]===-g.d[1]));if(!o2.length)o2=opts;
    let tx=P.x,ty=P.y,mode=Math.random()<smart?'chase':'rand';if(g.dead){tx=g.hx;ty=g.hy;mode='chase'}else if(g.fr){mode=Math.random()<.85?'flee':'rand'}
    if(mode==='rand'){g.d=o2[rnd(0,o2.length-1)];return}
    o2.sort((a,b)=>{const da=Math.hypot(cx+a[0]-tx,cy+a[1]-ty),db=Math.hypot(cx+b[0]-tx,cy+b[1]-ty);return mode==='flee'?db-da:da-db});g.d=o2[0]}
  function resetPos(){P.x=10;P.y=11;P.d=[0,0];P.nx=[0,0];ghosts.forEach((g,k)=>{g.x=g.hx;g.y=g.hy;g.d=[0,-1];g.delay=1+k*1.5;g.fr=false;g.dead=false});ready=1.2}
  // رسم المتاهة مرة واحدة
  const mz=document.createElement('canvas');mz.width=W;mz.height=H;{const m=mz.getContext('2d');m.fillStyle='#070b24';m.fillRect(0,0,W,H);
    for(let j=0;j<RH;j++)for(let i=0;i<CW;i++)if(wall(i,j)){const g=m.createLinearGradient(i*TS,j*TS,i*TS,j*TS+TS);g.addColorStop(0,'#3b5bfd');g.addColorStop(1,'#1e2fa8');m.fillStyle=g;m.beginPath();m.roundRect(i*TS+3,j*TS+3,TS-6,TS-6,9);m.fill();
      m.strokeStyle='rgba(147,197,253,.65)';m.lineWidth=2;m.stroke()}}
  let ft=0;
  A.loop(dt=>{const x=A.x;ft+=dt;
    if(ready>0)ready-=dt;else{
      if(P.nx[0]===-P.d[0]&&P.nx[1]===-P.d[1]&&(P.nx[0]||P.nx[1]))P.d=[...P.nx];
      move(P,pSp,dt,pacChoose);
      const key=Math.round(P.x)+','+Math.round(P.y);if(dots.has(key)&&Math.hypot(P.x-Math.round(P.x),P.y-Math.round(P.y))<.35){dots.delete(key);eaten++;score+=10;A.set('.dt',eaten);waka^=1;beep(waka?520:390,.05,'square',.05);
        if(power.has(key)){score+=40;ghosts.forEach(g=>{if(!g.dead)g.fr=true});ft=0;fxPt(A,(Math.round(P.x)+.5)*TS,(Math.round(P.y)+.5)*TS);sfx.good()}
        if(!dots.size)return A.win(score+lives*100,'أكلت كل النقاط! 🟡',{got:total,total,perfect:true,label:'النقاط'})}
      if(ghosts.some(g=>g.fr)&&ft>frT)ghosts.forEach(g=>g.fr=false);
      for(const g of ghosts){if(g.delay>0){g.delay-=dt;continue}move(g,g.dead?9:g.fr?gSp*.55:gSp,dt,ghostChoose);
        if(g.dead&&Math.abs(g.x-g.hx)<.1&&Math.abs(g.y-g.hy)<.1){g.dead=false;g.fr=false;g.delay=1}
        if(!g.dead&&Math.hypot(g.x-P.x,g.y-P.y)<.65){
          if(g.fr){g.dead=true;g.fr=false;score+=200;fxPt(A,(g.x+.5)*TS,(g.y+.5)*TS);sfx.good()}
          else{lives--;A.set('.lv2',heartsPill(lives));sfx.bad();if(lives<=0)return A.lose('أمسكك الشبح! 👻',res());resetPos();break}}}}
    x.drawImage(mz,0,0,W,H);
    const t=performance.now()/1000;
    for(const k of dots){const[i,j]=k.split(',').map(Number),cx=(i+.5)*TS,cy=(j+.5)*TS;
      if(power.has(k)){const r=9+Math.sin(t*6)*2.5,g=x.createRadialGradient(cx,cy,0,cx,cy,r*2);g.addColorStop(0,'#fff7c2');g.addColorStop(.5,'#fde047');g.addColorStop(1,'rgba(253,224,71,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*2,0,7);x.fill()}
      else{x.fillStyle='#fde68a';x.beginPath();x.arc(cx,cy,4,0,7);x.fill()}}
    // باكمان
    const px=(P.x+.5)*TS,py=(P.y+.5)*TS,ang=P.d[0]||P.d[1]?Math.atan2(P.d[1],P.d[0]):0,mo=(Math.sin(t*16)+1)/2*.42+.04;
    const pg=x.createRadialGradient(px-6,py-8,2,px,py,18);pg.addColorStop(0,'#fff59d');pg.addColorStop(1,'#facc15');x.fillStyle=pg;x.shadowColor='rgba(250,204,21,.6)';x.shadowBlur=14;
    x.beginPath();x.moveTo(px,py);x.arc(px,py,17,ang+mo*Math.PI,ang-mo*Math.PI+Math.PI*2);x.closePath();x.fill();x.shadowBlur=0;
    // الأشباح
    for(const g of ghosts){const gx=(g.x+.5)*TS,gy=(g.y+.5)*TS;
      if(!g.dead){const blink=g.fr&&ft>frT-2&&Math.sin(t*20)>0;const col=g.fr?(blink?'#e0e7ff':'#2563eb'):g.col;const gg=x.createLinearGradient(gx,gy-17,gx,gy+17);gg.addColorStop(0,'#ffffff55');gg.addColorStop(.25,col);gg.addColorStop(1,col);
        x.fillStyle=gg;x.beginPath();x.arc(gx,gy-2,16,Math.PI,0);x.lineTo(gx+16,gy+15);for(let k=0;k<4;k++){const wx=gx+16-(k+.5)*8;x.lineTo(wx,gy+(k%2?15:10)+Math.sin(t*12+k)*2)}x.lineTo(gx-16,gy+15);x.closePath();x.fill()}
      if(!g.fr||g.dead){[-6,6].forEach(o=>{x.fillStyle='#fff';x.beginPath();x.ellipse(gx+o,gy-4,4.5,6,0,0,7);x.fill();x.fillStyle='#1e3a8a';x.beginPath();x.arc(gx+o+g.d[0]*2,gy-4+g.d[1]*2.5,2.5,0,7);x.fill()})}
      else{x.fillStyle='#fff';[-5,5].forEach(o=>{x.fillRect(gx+o-2,gy-6,4,4)})}}
    if(ready>0)txt(x,'استعد!',W/2,(7.5)*TS,44,'#facc15');
    hintTxt(A,x,'كُل كل النقاط وتجنّب الأشباح. الكرة الكبيرة تجعل الأشباح خائفة!')});
};

/* ---- ألغاز الصور: رتّب القطع لتكتمل الصورة ---- */
G.jigsaw=(root,c)=>{
  const n=c.lv<5?2:c.lv<13?3:c.lv<23?4:5,N=n*n,secs=Math.round(({2:45,3:85,4:140,5:200})[n]*c.f(1.2,.85));
  const pics=GAMES.map(g=>g.id).filter(id=>id!=='jigsaw'),pic=pics[rnd(0,pics.length-1)],src=TSRC(pic);
  let T;do{T=shuffle([...Array(N).keys()])}while(T.every((v,i)=>v===i));let sel=-1,moves=0,best=0;
  root.innerHTML=`<div class="hud">${c.tag}<span class="pill">🧩 <b class="ok">0</b> من ${N}</span><span class="pill">🔁 <b class="mv">0</b></span></div><div class="body" style="bottom:36px"><div class="jg-wrap"><div class="jg-board" style="--n:${n}"></div><div class="jg-prev"><img src="${src}" alt="الصورة"><span>الصورة كاملة</span></div></div></div>`;
  const board=root.querySelector('.jg-board');const correct=()=>T.filter((v,i)=>v===i).length;
  function render(){board.innerHTML='';T.forEach((v,i)=>{const r=Math.floor(v/n),cc=v%n,el=h(`<button class="jg-t${v===i?' ok':''}${i===sel?' sel':''}" aria-label="قطعة"></button>`);
      el.style.backgroundImage=`url(${src})`;el.style.backgroundSize=`${n*100}% ${n*100}%`;el.style.backgroundPosition=`${n>1?cc/(n-1)*100:0}% ${n>1?r/(n-1)*100:0}%`;el.onclick=()=>pick(i);board.append(el)});
    root.querySelector('.ok').textContent=correct();root.querySelector('.mv').textContent=moves}
  function pick(i){if(sel<0){sel=i;sfx.pop();return render()}if(sel===i){sel=-1;return render()}
    const before=correct();[T[sel],T[i]]=[T[i],T[sel]];sel=-1;moves++;render();const now=correct();
    if(now>before)sfx.good();else beep(600,.05,'triangle',.07);
    if(now===N)c.after(()=>c.win(N*20+Math.round(tb.left())*3,`رتّبت الصورة في ${moves} نقلة! 🧩`,{got:N,total:N,perfect:true,label:'القطع'}),500)}
  const tb=c.timeBar(root,secs,()=>c.lose('انتهى الوقت!',{got:correct(),total:N,label:'القطع'}));
  render();
};

G.coloring=(root,c)=>{

      else{el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');mist++;root.querySelector('.ms').textContent=mist;sfx.bad();painting=false;if(mist>allow)c.after(()=>c.lose('أخطاء كثيرة! انتبه لرقم اللون',{got:done,total:need.length,label:'المربعات'}),300)}};

  c.on(window,'keydown',e=>{const d=e.code.match(/^Digit(\d)$/);if(d&&+d[1]>=1&&+d[1]<=keys.length)pal.children[+d[1]-1].click()});
  if(c.lv>=12)c.timeBar(root,Math.round(need.length*c.f(3.2,1.4)+8),()=>c.lose('انتهى الوقت!',{got:done,total:need.length,label:'المربعات'}));
};

  x.save();x.beginPath();x.ellipse(0,0,28,20,0,0,7);x.clip();x.fillStyle='#1f2937';[-12,0,12].forEach(s=>x.fillRect(s-3,-22,6,44));x.restore();
  x.fillStyle='#fff';x.beginPath();x.arc(19,-6,7,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(21,-6,3.5,0,7);x.fill();x.fillStyle='#1f2937';x.beginPath();x.moveTo(-28,0);x.lineTo(-38,-3);x.lineTo(-28,5);x.fill();x.restore()}
