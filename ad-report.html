<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>تقرير الحملة الإعلانية | فنتازيا</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#eef1ff;color:#1d2350}
header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#5b3cff,#ec4899);color:#fff}
header img{width:42px;height:42px;border-radius:12px}header h1{margin:0;font-size:21px;flex:1}
main{max-width:1000px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(29,35,80,.08)}.card b{display:block;font-size:30px;color:#5b3cff}.card span{color:#64748b;font-weight:700}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(29,35,80,.08);font-size:14px;margin-bottom:16px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid #eef1ff}th{background:#f8fafc;color:#475569}
.msg{background:#fff;border-radius:16px;padding:24px;text-align:center;font-weight:700}
.st{display:inline-block;padding:2px 12px;border-radius:99px;font-weight:700;font-size:14px}
h2{font-size:18px}.note{color:#64748b;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>تقرير الحملة الإعلانية · فنتازيا</h1></header>
<main id="r"><div class="msg">جاري التحميل…</div></main>
<script>
const R=document.getElementById('r'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US'),ctr=(i,c)=>i?(c/i*100).toFixed(2)+'%':'—';
(async()=>{const t=new URLSearchParams(location.search).get('t')||'';
  try{const j=await (await fetch('api/index.php?a=report&t='+encodeURIComponent(t))).json();if(!j.ok)throw new Error(j.error);
    const c=j.campaign,T=j.totals;
    R.innerHTML=`<h2>${esc(c.name)} <span class="st" style="background:${c.live?'#dcfce7':'#f1f5f9'}">${c.live?'🟢 تعمل الآن':c.status==='paused'?'⏸️ موقوفة':'⚪ منتهية'}</span></h2>
    <div class="note">المعلن: <b>${esc(c.advertiser)}</b> · الفترة: ${c.start||'—'} ← ${c.end||'مفتوحة'}</div>
    <div class="cards"><div class="card"><b>${fmt(T.i)}</b><span>مشاهدة فعلية</span></div><div class="card"><b>${fmt(T.c)}</b><span>نقرة</span></div><div class="card"><b>${ctr(T.i,T.c)}</b><span>نسبة النقر</span></div></div>
    <h2>حسب المساحة</h2><table><tr><th>المساحة</th><th>مشاهدات</th><th>نقرات</th><th>نسبة النقر</th></tr>${j.slots.map(s=>`<tr><td>${esc(j.slotNames[s.slot]||s.slot)}</td><td>${fmt(s.impr)}</td><td>${fmt(s.clicks)}</td><td>${ctr(s.impr,s.clicks)}</td></tr>`).join('')||'<tr><td colspan=4>لا بيانات بعد</td></tr>'}</table>
    <h2>يومياً</h2><table><tr><th>اليوم</th><th>مشاهدات</th><th>نقرات</th><th>نسبة النقر</th></tr>${j.daily.slice().reverse().map(d=>`<tr><td>${d.day}</td><td>${fmt(d.impr)}</td><td>${fmt(d.clicks)}</td><td>${ctr(d.impr,d.clicks)}</td></tr>`).join('')||'<tr><td colspan=4>لا بيانات بعد</td></tr>'}</table>
    <p class="note">المشاهدة تُحسب فقط عند ظهور 50% على الأقل من الإعلان على الشاشة لمدة ثانية كاملة (المعيار العالمي لقياس الإعلانات)، والنقرة تُحسب عند الضغط على الإعلان. فنتازيا لا تجمع أي بيانات شخصية عن الأطفال.</p>`}
  catch(e){R.innerHTML=`<div class="msg">${esc(e.message||'تعذّر تحميل التقرير')}</div>`}})();
</script>
</body>
</html>
