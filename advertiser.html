<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>بوابة المعلنين | فنتازيا</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#eef1ff;color:#1d2350}
a{color:#5b3cff}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,#5b3cff,#ec4899);color:#fff}
header img{width:40px;height:40px;border-radius:12px}header h1{margin:0;font-size:21px;flex:1}header a,header button{color:#fff;font-weight:700;background:rgba(255,255,255,.2);border:0;border-radius:99px;padding:6px 14px;text-decoration:none;font:inherit;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(29,35,80,.08);margin-bottom:16px}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 8px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm .full{grid-column:1/-1}@media(max-width:640px){.frm{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
input,select,textarea{font:inherit;font-size:15px;padding:9px 11px;border-radius:12px;border:2px solid #e2e6ff;background:#fff;outline:none}input:focus,textarea:focus{border-color:#5b3cff}
.btn{font:inherit;font-weight:800;border:0;border-radius:99px;padding:11px 26px;background:#5b3cff;color:#fff;cursor:pointer;font-size:16px}.btn:disabled{opacity:.6}
.btn.alt{background:#eef1ff;color:#1d2350}.btn.sm{padding:6px 14px;font-size:13px}
.err{color:#dc2626;font-weight:700;min-height:1.3em}.ok{color:#16a34a;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.pk{grid-template-columns:1fr}}
.pk label{flex-direction:row;align-items:flex-start;gap:10px;border:2px solid #e2e6ff;border-radius:14px;padding:12px;cursor:pointer;font-weight:600}.pk label.on{border-color:#5b3cff;background:#f5f3ff}
.pk input{width:20px;height:20px;accent-color:#5b3cff;margin:2px 0 0}.pk b{display:block;font-size:15px}.pk small{color:#64748b}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #eef1ff}th{color:#475569;background:#f8fafc}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#f1f5f9}
.st.pending{background:#fef3c7}.st.active{background:#dcfce7}.st.rejected{background:#fee2e2}
.note{color:#64748b;font-size:13px;line-height:1.8}
.pay{background:#f5f3ff;border-radius:14px;padding:14px;line-height:1.9;white-space:pre-line}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.steps span{background:#eef1ff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
.blk{border:2px solid #e2e6ff}.blk h3{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 0 10px;padding-bottom:10px;border-bottom:2px solid #eef1ff}.blk h4{margin:16px 0 8px;font-size:15px}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#5b3cff;color:#fff;align-items:center;justify-content:center;font-size:15px}
.track{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}.track span{padding:6px 14px;border-radius:99px;background:#f1f5f9;font-weight:700;font-size:14px;color:#94a3b8}.track i{flex:0 0 24px;height:2px;background:#e2e8f0}
.track span.done{background:#dcfce7;color:#166534}.track span.now{background:#fef3c7;color:#92400e}.track span.bad{background:#fee2e2;color:#b91c1c}
.rej{background:#fef2f2;border:2px solid #fecaca;border-radius:14px;padding:14px;line-height:1.8;margin:10px 0}
.imgs{display:flex;flex-wrap:wrap;gap:10px}.imgs figure{margin:0;background:#f8fafc;border-radius:12px;padding:8px;max-width:320px}.imgs img{max-width:100%;max-height:140px;display:block;border-radius:8px}.imgs figcaption{font-size:12px;color:#64748b;margin-top:4px}
.st.awaiting{background:#e0e7ff}.st.ended{background:#e2e8f0}
.ln{padding:2px 0}.ln+.ln{border-top:1px dashed #eef1ff}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:600px){.bal{grid-template-columns:1fr}}.bal div{background:#f8fafc;border-radius:14px;padding:12px}.bal span{display:block;color:#64748b;font-size:13px;font-weight:700}.bal b{font-size:22px}.bal .rm{background:#f5f3ff}.bal .rm b{color:#5b3cff}
.pbar{height:10px;background:#eef1ff;border-radius:99px;margin:12px 0 4px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5b3cff,#ec4899)}
.sl{border:2px solid #eef1ff;border-radius:14px;padding:12px;margin-bottom:12px}.sl-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.sl-h span{color:#5b3cff;font-weight:700;font-size:14px}
.im{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px dashed #eef1ff}.im img{width:min(420px,60%);max-height:170px;object-fit:contain;border-radius:8px;background:#f8fafc}
.im-s{display:flex;flex-direction:column;gap:2px;font-size:14px}.im-s span{color:#475569}
.fg{margin-inline-start:12px;font-size:14px;font-weight:700}
.terms{background:#f8fafc;border:2px solid #e2e6ff;border-radius:14px;padding:14px;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.terms label.chk{display:flex!important;align-items:flex-start;gap:8px;margin:0;line-height:1.7;font-weight:600!important;font-size:14px;cursor:pointer}.terms input{width:18px;height:18px;margin-top:4px;accent-color:#5b3cff;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chk{flex-direction:row!important;align-items:center;gap:6px;font-weight:600!important;display:inline-flex!important;margin:3px 10px 3px 0}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>بوابة المعلنين · فنتازيا</h1><span id="hdr"></span><a href="advertise.html">الأسعار والباقات</a></header>
<main id="app"><div class="card">جاري التحميل…</div></main>
<script src="js/ad-form.js?v=20261125b"></script>
<script>
const app=document.getElementById('app'),esc=AdForm.esc,fmt=AdForm.fmt;let tok=localStorage.getItem('fz:advtoken'),ME=null;
const CATS={edu:'تعليمية',brain:'الذكاء',memory:'الذاكرة',focus:'التركيز',speed:'السرعة',logic:'المنطق',action:'حركة وسرعة',classic:'كلاسيكية',cars:'سيارات',io:'io',two:'لاعبَين',puzzle:'ألغاز',dress:'تلبيس وتجميل'};
const ST={pending:'⏳ بانتظار الموافقة',awaiting:'💳 بانتظار السداد',active:'🟢 مقبولة وتعمل',paused:'⏸️ موقوفة مؤقتاً',rejected:'❌ مرفوضة، تحتاج تعديلاً',ended:'⏹️ موقوفة نهائياً'};
const DVN={d:'💻 كمبيوتر',t:'📱 تابلت',m:'📲 جوال'};
const stName=c=>c.status==='active'&&!c.live&&c.pricing!=='daily'&&c.bal&&c.bal.remaining<=0.01?'✅ اكتملت':c.status==='active'&&!c.live?(c.start>new Date(Date.now()+108e5).toISOString().slice(0,10)?'🗓️ مقبولة، تبدأ '+c.start:'⚪ منتهية'):ST[c.status]||c.status;
async function api(a,body={},auth=true){const r=await fetch('api/index.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json',...(auth&&tok?{Authorization:'Bearer '+tok}:{})},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({ok:false,error:'الخادم لا يستجيب'}));if(r.status===401){tok=null;localStorage.removeItem('fz:advtoken');authView();throw new Error('auth')}if(!j.ok)throw new Error(j.error||'خطأ');return j}
function authView(mode='login'){document.getElementById('hdr').innerHTML='';
  app.innerHTML=`<div class="card" style="max-width:540px;margin:20px auto"><h2>📢 أعلن في فنتازيا</h2><p class="note">أنشئ حملتك بنفسك: اختر المساحات، وارفع صور إعلانك، وشاهد السعر مباشرة. نراجع إعلانك ونرسل لك الفاتورة، وبعد السداد تبدأ حملتك وتتابع نتائجها لحظة بلحظة.</p>
  <div class="tabs"><button class="btn ${mode==='login'?'':'alt'}" data-m="login">تسجيل الدخول</button><button class="btn ${mode==='reg'?'':'alt'}" data-m="reg">حساب معلن جديد</button></div>
  <form id="af" class="frm">${mode==='reg'?'<label>اسمك<input name="name" required></label><label>الشركة / العلامة التجارية<input name="company" required></label><label class="full">رقم الجوال<input name="phone" dir="ltr" inputmode="tel"></label>':''}
  <label class="full">البريد الإلكتروني<input name="email" type="email" dir="ltr" required></label><label class="full">كلمة المرور${mode==='reg'?' (8 أحرف على الأقل)':''}<input name="password" type="password" dir="ltr" required></label>
  <div class="full err" id="er"></div><div class="full"><button class="btn" type="submit">${mode==='reg'?'إنشاء الحساب':'دخول'}</button>${mode==='login'?' <a href="#" id="fg" class="fg">نسيت كلمة المرور؟</a>':''}</div></form>
  <p class="note" style="margin-top:14px">ℹ️ حساب المعلن منفصل عن حساب اللاعب في الألعاب. يمكنك استخدام نفس البريد للاثنين بلا أي تعارض، وإذا دخلت حساب اللاعب بنفس البريد يظهر لك زر «بوابة المعلنين» في لوحته.</p></div>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authView(b.dataset.m));
  app.querySelector('#fg')?.addEventListener('click',e=>{e.preventDefault();forgotView(app.querySelector('[name=email]').value)});
  app.querySelector('#af').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const j=await api(mode==='reg'?'adv_register':'adv_login',d,false);tok=j.token;localStorage.setItem('fz:advtoken',tok);route()}catch(er){app.querySelector('#er').textContent=er.message}}}
function forgotView(email=''){document.getElementById('hdr').innerHTML='';
  app.innerHTML=`<div class="card" style="max-width:540px;margin:20px auto"><h2>🔑 استعادة كلمة المرور</h2><p class="note">اكتب بريدك المسجّل كمعلن، وسنرسل لك رابطاً لاختيار كلمة مرور جديدة (صالح ساعة واحدة).</p>
  <form id="ff" class="frm"><label class="full">البريد الإلكتروني<input name="email" type="email" dir="ltr" required value="${esc(email)}"></label><div class="full err" id="er"></div>
  <div class="full"><button class="btn" type="submit">إرسال الرابط</button> <button class="btn alt" type="button" id="bk">رجوع</button></div></form></div>`;
  app.querySelector('#bk').onclick=()=>authView();
  app.querySelector('#ff').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;
    try{await api('adv_forgot',{email:e.target.email.value},false);app.querySelector('.card').innerHTML=`<h2 class="ok">📧 تحقق من بريدك</h2><p>إذا كان <b dir="ltr">${esc(e.target.email.value)}</b> مسجّلاً كمعلن فسيصلك رابط إعادة التعيين خلال دقائق.</p><p class="note">لم يصلك؟ تحقق من مجلد الرسائل غير المرغوب فيها (Junk / Spam).</p><button class="btn alt" onclick="authView()">رجوع لتسجيل الدخول</button>`}
    catch(er){app.querySelector('#er').textContent=er.message;b.disabled=false}}}
function resetView(t){document.getElementById('hdr').innerHTML='';
  app.innerHTML=`<div class="card" style="max-width:540px;margin:20px auto"><h2>🔑 كلمة مرور جديدة</h2><form id="rf" class="frm"><label class="full">كلمة المرور الجديدة (8 أحرف على الأقل)<input name="p1" type="password" dir="ltr" required></label>
  <label class="full">تأكيد كلمة المرور<input name="p2" type="password" dir="ltr" required></label><div class="full err" id="er"></div><div class="full"><button class="btn" type="submit">حفظ والدخول</button></div></form></div>`;
  app.querySelector('#rf').onsubmit=async e=>{e.preventDefault();const f=e.target,er=app.querySelector('#er');if(f.p1.value!==f.p2.value)return er.textContent='كلمتا المرور غير متطابقتين';
    try{const j=await api('adv_reset',{token:t,password:f.p1.value},false);tok=j.token;localStorage.setItem('fz:advtoken',tok);history.replaceState(null,'',location.pathname);route()}catch(x){er.textContent=x.message}}}
async function load(){ME=await api('adv_me');document.getElementById('hdr').innerHTML='<button id="lo">خروج</button>';
  document.getElementById('lo').onclick=async()=>{await api('adv_logout').catch(()=>{});tok=null;localStorage.removeItem('fz:advtoken');location.hash='';authView()};return ME}
async function route(){const rs=location.hash.match(/^#reset=([a-f0-9]{48})/);if(rs)return resetView(rs[1]);if(!tok)return authView();try{await load()}catch(e){if(e.message!=='auth')app.innerHTML=`<div class="card err">${esc(e.message)}</div>`;return}
  const m=location.hash.match(/^#c=(\d+)/);if(m){const c=ME.campaigns.find(x=>x.id==m[1]);if(c)return detail(c)}dash()}
addEventListener('hashchange',route);
const sn=()=>Object.fromEntries(ME.slots.map(s=>[s.slot,s.t]));
function pkg(c){return c.pricing==='daily'?`👑 حجز حصري ${c.start} ← ${c.end}`:`📊 ${fmt(c.max_impr)} ظهور لكل مساحة، تبدأ ${c.start||'فوراً'}`}
function dash(msg){const j=ME,cur=j.settings.currency,N=sn();
  app.innerHTML=`${msg||''}<div class="card"><h2>👋 أهلاً ${esc(j.adv.name)} · ${esc(j.adv.company)}</h2><button class="btn" id="nc">➕ حملة إعلانية جديدة</button></div>
  <div class="card"><h2>📋 حملاتي</h2><div style="overflow:auto"><table><tr><th>الحملة</th><th>المساحات</th><th>الباقة</th><th>القيمة</th><th>الرصيد المتبقي</th><th>الحالة</th><th>ظهور</th><th>نقرات</th></tr>
  ${j.campaigns.map(c=>`<tr><td><a href="#c=${c.id}"><b>${esc(c.name)}</b></a></td><td>${c.slots.split(',').map(s=>esc(N[s]||s)).join('<br>')}</td><td>${pkg(c)}</td><td>${AdForm.money(c.price,cur)}</td><td>${c.bal?.paid?AdForm.money(c.bal.remaining,cur):'—'}</td>
   <td><span class="st ${c.status}">${stName(c)}</span></td><td>${fmt(c.impr)}</td><td>${fmt(c.clicks)}</td></tr>`).join('')||'<tr><td colspan=8>لا توجد حملات بعد. ابدأ أول حملة الآن.</td></tr>'}</table></div><p class="note">اضغط اسم الحملة لترى تفاصيلها وحالتها.</p></div>`;
  app.querySelector('#nc').onclick=()=>form()}
function detail(c){const cur=ME.settings.currency,N=sn();let cr={};try{cr=JSON.parse(c.creatives||'{}')}catch(e){}
  const steps=[['pending','⏳ المراجعة'],['awaiting','💳 السداد'],['active','🚀 التشغيل']],idx=c.status==='rejected'?0:c.status==='pending'?0:c.status==='awaiting'?1:2;
  app.innerHTML=`<div class="card"><a href="#" class="note">→ كل حملاتي</a><h2 style="margin-top:6px">${esc(c.name)} <span class="st ${c.status}">${stName(c)}</span></h2>
  <div class="track">${steps.map((s,i)=>`<span class="${c.status==='rejected'&&i===0?'bad':i<idx||(i===idx&&c.status==='active')?'done':i===idx?'now':''}">${s[1]}</span>`).join('<i></i>')}</div>
  ${c.status==='rejected'?`<div class="rej"><b>❌ سبب الرفض:</b> ${esc(c.note||'لم يُذكر سبب')}<br><button class="btn" id="ed" style="margin-top:10px">✏️ تعديل الحملة وإعادة الإرسال</button></div>`:''}
  ${c.status==='pending'?`<p class="note">نراجع إعلانك الآن، ويصلك بريد بالفاتورة عند الموافقة. يمكنك تعديل الحملة قبل المراجعة.</p><button class="btn alt" id="ed">✏️ تعديل</button> <button class="btn alt" id="del">🗑️ حذف الطلب</button>`:''}
  ${c.status==='awaiting'?`<p>✅ تمت الموافقة على إعلانك. سدّد الفاتورة لتبدأ الحملة.</p><a class="btn" href="invoice.html?t=${c.report_token}" target="_blank">📄 عرض الفاتورة ${esc(c.invoice_no)}</a>`:''}
  ${['active','paused','ended'].includes(c.status)?`<a class="btn" href="ad-report.html?t=${c.report_token}" target="_blank">📊 التقرير المباشر</a> ${c.invoice_no?`<a class="btn alt" href="invoice.html?t=${c.report_token}" target="_blank">📄 الفاتورة</a>`:''}`:''}</div>
  <div class="card"><h2>📝 تفاصيل الحملة</h2><table><tr><td style="width:130px">المساحات</td><td>${c.slots.split(',').map(s=>`<div class="ln">${esc(N[s]||s)}</div>`).join('')}</td></tr><tr><td>الأقسام</td><td>${c.cats?c.cats.split(',').map(k=>CATS[k]||k).join('، '):'كل الموقع'}</td></tr>
   <tr><td>الباقة</td><td>${pkg(c)}</td></tr><tr><td>القيمة</td><td><b>${AdForm.money(c.price,cur)}</b></td></tr><tr><td>الرابط</td><td dir="ltr"><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.link)}</a></td></tr>
   <tr><td>الأداء</td><td>${fmt(c.impr)} ظهور · ${fmt(c.clicks)} نقرة</td></tr></table></div>
  ${c.bal?.paid?`<div class="card"><h2>💰 رصيد الحملة</h2><div class="bal"><div><span>قيمة الحملة</span><b>${AdForm.money(c.bal.price,cur)}</b></div><div><span>المستهلك</span><b>${AdForm.money(c.bal.consumed,cur)}</b></div>
   <div class="rm"><span>${c.status==='ended'?'المبلغ المسترد':'الرصيد المتبقي'}</span><b>${AdForm.money(c.status==='ended'?c.bal.refund:c.bal.remaining,cur)}</b></div></div>
   <div class="pbar"><i style="width:${Math.min(100,c.bal.consumed/Math.max(.01,c.bal.price)*100)}%"></i></div><p class="note">${c.pricing==='daily'?'في الحجز الحصري يُحتسب كل يوم يمر من أيام الحجز.':'يُحتسب الرصيد حسب مرات الظهور الفعلية لكل مساحة.'}</p></div>`:''}
  <div class="card"><h2>🖼️ صور الإعلان وأداؤها</h2>${c.slots.split(',').map(s=>{const v=cr[s]||{},ss=c.slotStats?.[s]||{impr:0,clicks:0},b=c.bal?.slots?.[s];
    return `<div class="sl"><div class="sl-h"><b>${esc(N[s]||s)}</b><span>${fmt(ss.impr)} ظهور · ${fmt(ss.clicks)} نقرة${b?(c.pricing==='daily'?` · ${b.daysUsed} من ${b.days} يوم`:` · المتبقي ${fmt(b.imprLeft)} ظهور`):''}</span></div>
     ${Object.entries(v).map(([d,u])=>{const ds=c.dev?.[s]?.[d]||{impr:0,clicks:0};return `<div class="im"><img src="${esc(u)}" alt=""><div class="im-s"><b>${DVN[d]||d}</b><span>${fmt(ds.impr)} ظهور</span><span>${fmt(ds.clicks)} نقرة</span></div></div>`}).join('')}</div>`}).join('')}
   <p class="note">أرقام كل صورة تُحسب حسب الجهاز الذي ظهرت عليه. الظهور قبل تفعيل هذه الميزة يظهر في مجموع المساحة فقط.</p></div>`;
  app.querySelector('#ed')?.addEventListener('click',()=>form(c));
  app.querySelector('#del')?.addEventListener('click',async()=>{if(!confirm('حذف طلب الحملة؟'))return;await api('adv_cancel',{id:c.id}).catch(e=>alert(e.message));location.hash='';route()})}
async function form(c={}){const j=ME,S=j.settings,cur=S.currency,cr0={};try{Object.assign(cr0,JSON.parse(c.creatives||'{}'))}catch(e){}
  const anyDaily=j.slots.some(s=>s.price.daily_on),anyCpm=j.slots.some(s=>s.price.cpm_on);
  let bk;try{bk=await api('ad_booked',{id:c.id||0},false)}catch(e){bk={booked:{},today:new Date().toISOString().slice(0,10)}}
  const minD=bk.today>(c.start||'')?bk.today:bk.today;const daily0=c.pricing==='daily'||!anyCpm;
  app.innerHTML=`<div class="card"><div class="steps"><span>1 المساحات</span><span>2 الباقة والمدة</span><span>3 صور الإعلان</span><span>4 الإرسال</span></div><h2>${c.id?'✏️ تعديل الحملة':'➕ حملة إعلانية جديدة'}</h2>
  <label>اسم الحملة<input id="nm" value="${esc(c.name)}" placeholder="مثال: عروض العودة للمدارس"></label></div>
  <form id="cf">
  <section class="card blk"><h3><span class="num">1</span> المساحات</h3><p class="note">اضغط «👁️ مشاهدة موقع الإعلان» لترى مكانه على الجوال والتابلت والكمبيوتر.</p><div id="sb"></div>
   <h4>🎯 الأقسام التي يظهر فيها إعلانك</h4><div id="cb"></div></section>
  <section class="card blk"><h3><span class="num">2</span> الباقة والمدة</h3><div class="pk">
   ${anyCpm?`<label class="${!daily0?'on':''}"><input type="radio" name="pricing" value="cpm"${!daily0?' checked':''}><span><b>📊 مرات ظهور</b><small>تدفع مقابل عدد مرات ظهور إعلانك، ويتناوب مع معلنين آخرين. تنتهي الحملة تلقائياً عند اكتمال العدد.</small></span></label>`:''}
   ${anyDaily?`<label class="${daily0?'on':''}"><input type="radio" name="pricing" value="daily"${daily0?' checked':''}><span><b>👑 حجز حصري بالأيام</b><small>إعلانك وحده في المساحة طوال الأيام المحجوزة، ولا يُقبل أي معلن آخر فيها.</small></span></label>`:''}</div>
   <label class="k-cpm" style="margin-top:12px">عدد مرات الظهور (لكل مساحة)<select name="impr">${[10000,25000,50000,100000,250000,500000].filter(n=>n>=+S.min_impr).map(n=>`<option value="${n}"${+c.max_impr===n?' selected':''}>${fmt(n)}</option>`).join('')}</select></label>
   <h4 id="calT"></h4><div id="cal"></div><div id="qb" style="margin-top:12px"></div></section>
  <section class="card blk"><h3><span class="num">3</span> صور الإعلان</h3><div id="crs"></div>
   <label style="margin-top:10px">رابط موقعك أو صفحة المنتج<input name="link" dir="ltr" value="${esc(c.link)}" placeholder="https://"></label>
   <label style="margin-top:10px">وصف قصير للإعلان (يُقرأ لضعاف البصر)<input name="alt" value="${esc(c.alt)}"></label></section>
  <section class="card blk"><h3><span class="num">4</span> الإرسال</h3><div id="sum"></div>
   <div class="terms"><b>شروط الإعلان (يجب الموافقة عليها جميعاً)</b>
    <label class="chk"><input type="checkbox" class="tm"> أقرّ بأن الإعلان مناسب للأطفال والعائلات، ولا يحتوي محتوى مقيّداً بالعمر أو مضللاً.</label>
    <label class="chk"><input type="checkbox" class="tm"> أعلم أن فنتازيا تراجع كل إعلان قبل نشره، وأن <b>للمنصة الحق في قبول أو رفض أي إعلان</b>.</label>
    <label class="chk"><input type="checkbox" class="tm"> أعلم أن الخروج من الموقع عبر إعلاني يمر ببوابة الأهل.</label>
    <label class="chk"><input type="checkbox" class="tm"> أعلم أن الحملة تبدأ بعد الموافقة عليها وسداد الفاتورة الإلكترونية.</label></div>
   <div class="err" id="er"></div><button class="btn" type="submit" disabled title="وافق على الشروط أولاً">📨 إرسال الحملة للمراجعة</button> <button class="btn alt" type="button" id="bk">رجوع</button></section></form>`;
  const f=app.querySelector('#cf'),err=m=>app.querySelector('#er').textContent=m||'';
  const getSel=AdForm.slotPicker(app.querySelector('#sb'),j.slots,(c.slots||'').split(','),{showPrice:true,currency:cur,onChange:()=>{crs.draw();cal.set({booked:booked()});quote()}});
  const getCats=AdForm.catsPicker(app.querySelector('#cb'),CATS,(c.cats||'').split(','));
  const crs=AdForm.creatives(app.querySelector('#crs'),j.slots,getSel,cr0,err);
  const booked=()=>getSel().flatMap(s=>bk.booked[s]||[]);
  const mode=()=>(f.pricing?.value||'cpm')==='daily'?'range':'single';
  const cal=AdForm.calendar(app.querySelector('#cal'),{mode:mode(),min:minD,booked:booked(),start:c.start&&c.start>=minD?c.start:'',end:c.pricing==='daily'?c.end:'',onChange:()=>quote()});
  let qt,lastQ=null;const quote=()=>{clearTimeout(qt);qt=setTimeout(async()=>{const p=f.pricing?.value||'cpm';f.querySelectorAll('.pk label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));app.querySelectorAll('.k-cpm').forEach(x=>x.hidden=p!=='cpm');
    app.querySelector('#calT').textContent=p==='daily'?'🗓️ أيام الحجز (من - إلى)':'🗓️ تاريخ بداية الحملة';
    const d=cal.get(),sum=app.querySelector('#sum');
    if(!getSel().length){app.querySelector('#qb').innerHTML='<div class="af-q note">اختر مساحة لترى السعر.</div>';sum.innerHTML='';lastQ=null;return}
    if(!d.start||(p==='daily'&&!d.end)){app.querySelector('#qb').innerHTML=`<div class="af-q note">${p==='daily'?'اختر يوم البداية ويوم النهاية من التقويم':'اختر تاريخ البداية من التقويم'} لترى السعر.</div>`;sum.innerHTML='';lastQ=null;return}
    try{const r=await api('adv_quote',{id:c.id||0,slots:getSel(),pricing:p,start:d.start,end:p==='daily'?d.end:'',impr:+f.impr.value});lastQ=r.quote;app.querySelector('#qb').innerHTML=AdForm.quoteHTML(r.quote);
      sum.innerHTML=`<div class="af-q"><b>الإجمالي: ${AdForm.money(r.quote.total,r.quote.currency)}</b><div class="note">${getSel().length} مساحة · ${p==='daily'?`حجز حصري ${r.quote.days} يوم`:`${fmt(r.quote.impr)} ظهور لكل مساحة`}</div></div>`}
    catch(e){lastQ=null;sum.innerHTML='';if(e.message!=='auth')app.querySelector('#qb').innerHTML=AdForm.quoteHTML(null,e.message)}},250)};
  f.querySelectorAll('[name=pricing]').forEach(x=>x.addEventListener('change',()=>{cal.set({mode:mode(),end:''});quote()}));f.impr?.addEventListener('change',quote);quote();
  app.querySelector('#bk').onclick=()=>{location.hash='';route()};
  const tms=[...app.querySelectorAll('.tm')],sb=f.querySelector('[type=submit]');tms.forEach(t=>t.onchange=()=>{sb.disabled=!tms.every(x=>x.checked)});
  f.onsubmit=async e=>{e.preventDefault();err();const fd=new FormData(f),d=cal.get(),cats=getCats();
    if(!getSel().length)return err('اختر مساحة إعلانية');if(cats===null)return err('اختر قسماً واحداً على الأقل، أو «الكل»');if(!lastQ)return err('أكمل اختيار الباقة والتاريخ');
    const b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='⏳ جاري الإرسال…';
    try{const r=await api('adv_save',{id:c.id||0,name:app.querySelector('#nm').value,slots:getSel(),cats,pricing:fd.get('pricing')||'cpm',impr:+fd.get('impr'),start:d.start,end:fd.get('pricing')==='daily'?d.end:'',creatives:crs.value(),link:fd.get('link'),alt:fd.get('alt'),terms:tms.every(x=>x.checked)});
      scrollTo(0,0);await load();location.hash='c='+r.id;}
    catch(er){if(er.message!=='auth'){err(er.message);b.disabled=!tms.every(x=>x.checked);b.textContent='📨 إرسال الحملة للمراجعة'}}}}
route();
</script>
<script src="js/totop.js"></script>
<script src="js/footer.js?v=2"></script>
</body>
</html>
