<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>بوابة المعلنين | فنتازيا</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#eef1ff;color:#1d2350}
a{color:#5b3cff}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,#5b3cff,#ec4899);color:#fff}
header img{width:40px;height:40px;border-radius:12px}header h1{margin:0;font-size:21px;flex:1}header a,header button{color:#fff;font-weight:700;background:rgba(255,255,255,.2);border:0;border-radius:99px;padding:6px 14px;text-decoration:none;font:inherit;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(29,35,80,.08);margin-bottom:16px}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 8px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm .full{grid-column:1/-1}@media(max-width:640px){.frm{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
input,select,textarea{font:inherit;font-size:15px;padding:9px 11px;border-radius:12px;border:2px solid #e2e6ff;background:#fff;outline:none}input:focus,textarea:focus{border-color:#5b3cff}
.btn{font:inherit;font-weight:800;border:0;border-radius:99px;padding:11px 26px;background:#5b3cff;color:#fff;cursor:pointer;font-size:16px}.btn:disabled{opacity:.6}
.btn.alt{background:#eef1ff;color:#1d2350}.btn.sm{padding:6px 14px;font-size:13px}
.err{color:#dc2626;font-weight:700;min-height:1.3em}.ok{color:#16a34a;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.pk{grid-template-columns:1fr}}
.pk label{flex-direction:row;align-items:flex-start;gap:10px;border:2px solid #e2e6ff;border-radius:14px;padding:12px;cursor:pointer;font-weight:600}.pk label.on{border-color:#5b3cff;background:#f5f3ff}
.pk input{width:20px;height:20px;accent-color:#5b3cff;margin:2px 0 0}.pk b{display:block;font-size:15px}.pk small{color:#64748b}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid #eef1ff}th{color:#475569;background:#f8fafc}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#f1f5f9}
.st.pending{background:#fef3c7}.st.active{background:#dcfce7}.st.rejected{background:#fee2e2}
.note{color:#64748b;font-size:13px;line-height:1.8}
.pay{background:#f5f3ff;border-radius:14px;padding:14px;line-height:1.9;white-space:pre-line}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.steps span{background:#eef1ff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700}
.chk{flex-direction:row!important;align-items:center;gap:6px;font-weight:600!important;display:inline-flex!important;margin:3px 10px 3px 0}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>بوابة المعلنين · فنتازيا</h1><span id="hdr"></span><a href="advertise.html">الأسعار والباقات</a></header>
<main id="app"><div class="card">جاري التحميل…</div></main>
<script src="js/ad-form.js?v=20261125a"></script>
<script>
const app=document.getElementById('app'),esc=AdForm.esc,fmt=AdForm.fmt;let tok=localStorage.getItem('fz:advtoken'),ME=null;
const CATS={edu:'تعليمية',brain:'الذكاء',memory:'الذاكرة',focus:'التركيز',speed:'السرعة',logic:'المنطق',action:'حركة وسرعة',classic:'كلاسيكية',cars:'سيارات',io:'io',two:'لاعبَين',puzzle:'ألغاز',dress:'تلبيس وتجميل'};
const ST={pending:'⏳ بانتظار الدفع والموافقة',active:'🟢 تعمل',paused:'⏸️ موقوفة مؤقتاً',rejected:'❌ تحتاج تعديلاً'};
async function api(a,body={},auth=true){const r=await fetch('api/index.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json',...(auth&&tok?{Authorization:'Bearer '+tok}:{})},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({ok:false,error:'الخادم لا يستجيب'}));if(r.status===401){tok=null;localStorage.removeItem('fz:advtoken');authView();throw new Error('auth')}if(!j.ok)throw new Error(j.error||'خطأ');return j}
function authView(mode='login'){document.getElementById('hdr').innerHTML='';
  app.innerHTML=`<div class="card" style="max-width:520px;margin:20px auto"><h2>📢 أعلن في فنتازيا</h2><p class="note">أنشئ حملتك بنفسك: اختر المساحات، وارفع صور إعلانك، وشاهد السعر مباشرة. بعد الدفع نفعّل حملتك وتتابع نتائجها لحظة بلحظة.</p>
  <div class="tabs"><button class="btn ${mode==='login'?'':'alt'}" data-m="login">تسجيل الدخول</button><button class="btn ${mode==='reg'?'':'alt'}" data-m="reg">حساب معلن جديد</button></div>
  <form id="af" class="frm">${mode==='reg'?'<label>اسمك<input name="name" required></label><label>الشركة / العلامة التجارية<input name="company" required></label><label class="full">رقم الجوال<input name="phone" dir="ltr" inputmode="tel"></label>':''}
  <label class="full">البريد الإلكتروني<input name="email" type="email" dir="ltr" required></label><label class="full">كلمة المرور${mode==='reg'?' (8 أحرف على الأقل)':''}<input name="password" type="password" dir="ltr" required></label>
  <div class="full err" id="er"></div><div class="full"><button class="btn" type="submit">${mode==='reg'?'إنشاء الحساب':'دخول'}</button></div></form></div>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authView(b.dataset.m));
  app.querySelector('#af').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const j=await api(mode==='reg'?'adv_register':'adv_login',d,false);tok=j.token;localStorage.setItem('fz:advtoken',tok);dash()}catch(er){app.querySelector('#er').textContent=er.message}}}
async function dash(msg){if(!tok)return authView();let j;try{j=ME=await api('adv_me')}catch(e){if(e.message!=='auth')app.innerHTML=`<div class="card err">${esc(e.message)}</div>`;return}
  document.getElementById('hdr').innerHTML=`<button id="lo">خروج</button>`;document.getElementById('lo').onclick=async()=>{await api('adv_logout').catch(()=>{});tok=null;localStorage.removeItem('fz:advtoken');authView()};
  const cur=j.settings.currency,sn=Object.fromEntries(j.slots.map(s=>[s.slot,s.t]));
  app.innerHTML=`${msg||''}<div class="card"><h2>👋 أهلاً ${esc(j.adv.name)} · ${esc(j.adv.company)}</h2><button class="btn" id="nc">➕ حملة إعلانية جديدة</button></div>
  <div class="card"><h2>📋 حملاتي</h2><div style="overflow:auto"><table><tr><th>الحملة</th><th>المساحات</th><th>الباقة</th><th>القيمة</th><th>الحالة</th><th>ظهور</th><th>نقرات</th><th></th></tr>
  ${j.campaigns.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.slots.split(',').map(s=>esc(sn[s]||s)).join('<br>')}</td><td>${c.pricing==='daily'?`حصري ${c.start} ← ${c.end}`:`${fmt(c.max_impr)} ظهور`}</td><td>${AdForm.money(c.price,cur)}</td>
   <td><span class="st ${c.status}">${c.status==='active'&&!c.live?'⚪ منتهية/لم تبدأ':ST[c.status]}</span>${c.note?`<div class="note">${esc(c.note)}</div>`:''}</td><td>${fmt(c.impr)}</td><td>${fmt(c.clicks)}</td>
   <td style="white-space:nowrap">${['pending','rejected'].includes(c.status)?`<button class="btn sm alt" data-e="${c.id}">✏️ تعديل</button> <button class="btn sm alt" data-x="${c.id}">🗑️</button>`:`<a class="btn sm alt" href="ad-report.html?t=${c.report_token}" target="_blank">📊 التقرير</a>`}</td></tr>`).join('')||'<tr><td colspan=8>لا توجد حملات بعد. ابدأ أول حملة الآن.</td></tr>'}</table></div>
  ${j.campaigns.some(c=>c.status==='pending')&&j.settings.pay_info?`<h3>💳 طريقة الدفع</h3><div class="pay">${esc(j.settings.pay_info)}</div><p class="note">بعد التحويل أرسل الإيصال على بريد الإدارة، ونفعّل حملتك ويصلك بريد بذلك.</p>`:''}</div>`;
  app.querySelector('#nc').onclick=()=>form();
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(j.campaigns.find(c=>c.id==b.dataset.e)));
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف طلب الحملة؟'))return;await api('adv_cancel',{id:+b.dataset.x}).catch(e=>alert(e.message));dash()})}
function form(c={}){const j=ME,S=j.settings,cur=S.currency,cr0={};try{Object.assign(cr0,JSON.parse(c.creatives||'{}'))}catch(e){}
  const anyDaily=j.slots.some(s=>s.price.daily_on),anyCpm=j.slots.some(s=>s.price.cpm_on),cats=(c.cats||'').split(','),tomorrow=new Date(Date.now()+3*3600e3+864e5).toISOString().slice(0,10);
  app.innerHTML=`<div class="card"><div class="steps"><span>1 المساحات</span><span>2 الباقة والمدة</span><span>3 صور الإعلان</span><span>4 الإرسال والدفع</span></div><h2>${c.id?'✏️ تعديل الحملة':'➕ حملة إعلانية جديدة'}</h2>
  <form id="cf" class="frm"><label class="full">اسم الحملة<input name="name" value="${esc(c.name)}" placeholder="مثال: عروض العودة للمدارس"></label>
  <div class="full"><h3>1) اختر مكان إعلانك</h3><p class="note">اضغط «👁️ مشاهدة موقع الإعلان» لترى مكانه على الجوال والتابلت والكمبيوتر.</p><div id="sb"></div></div>
  <details class="full"><summary style="cursor:pointer;font-weight:700">🎯 استهداف أقسام معيّنة (اختياري)</summary><div style="margin-top:8px">${Object.entries(CATS).map(([k,v])=>`<label class="chk"><input type="checkbox" name="cats" value="${k}"${cats.includes(k)?' checked':''}> ${v}</label>`).join('')}</div><p class="note">اتركها فارغة ليظهر إعلانك في كل الموقع.</p></details>
  <div class="full"><h3>2) الباقة والمدة</h3><div class="pk">
   ${anyCpm?`<label class="${c.pricing!=='daily'?'on':''}"><input type="radio" name="pricing" value="cpm"${c.pricing!=='daily'?' checked':''}><span><b>📊 مرات ظهور</b><small>تدفع مقابل عدد مرات ظهور إعلانك، ويتناوب مع معلنين آخرين. مناسب للميزانيات المرنة.</small></span></label>`:''}
   ${anyDaily?`<label class="${c.pricing==='daily'||!anyCpm?'on':''}"><input type="radio" name="pricing" value="daily"${c.pricing==='daily'||!anyCpm?' checked':''}><span><b>👑 حجز حصري بالأيام</b><small>إعلانك وحده في المساحة طوال الأيام المحجوزة، بدون أي معلن آخر.</small></span></label>`:''}</div></div>
  <label class="k-cpm">عدد مرات الظهور (لكل مساحة)<select name="impr">${[10000,25000,50000,100000,250000,500000].filter(n=>n>=+S.min_impr).map(n=>`<option value="${n}"${+c.max_impr===n?' selected':''}>${fmt(n)}</option>`).join('')}</select></label>
  <label>تاريخ البداية<input type="date" name="start" min="${tomorrow}" value="${esc(c.start||tomorrow)}"></label><label>تاريخ النهاية <small class="k-cpm note">(اختياري)</small><input type="date" name="end" min="${tomorrow}" value="${esc(c.end)}"></label>
  <div class="full" id="qb"></div>
  <div class="full"><h3>3) صور الإعلان</h3><div id="crs"></div></div>
  <label class="full">رابط موقعك أو صفحة المنتج<input name="link" dir="ltr" value="${esc(c.link)}" placeholder="https://"></label>
  <label class="full">وصف قصير للإعلان (يُقرأ لضعاف البصر)<input name="alt" value="${esc(c.alt)}"></label>
  <div class="full note">✅ نراجع كل إعلان قبل نشره: يجب أن يكون مناسباً للأطفال والعائلات. الخروج من الموقع عبر إعلانك يمر ببوابة الأهل.</div>
  <div class="full err" id="er"></div><div class="full"><button class="btn" type="submit">📨 إرسال الحملة</button> <button class="btn alt" type="button" id="bk">رجوع</button></div></form></div>`;
  const f=app.querySelector('#cf'),err=m=>app.querySelector('#er').textContent=m||'';
  const getSel=AdForm.slotPicker(app.querySelector('#sb'),j.slots,(c.slots||'').split(','),{showPrice:true,currency:cur,onChange:()=>{crs.draw();quote()}});
  const crs=AdForm.creatives(app.querySelector('#crs'),j.slots,getSel,cr0,err);
  let qt,lastQ=null;const quote=()=>{clearTimeout(qt);qt=setTimeout(async()=>{const p=f.pricing?.value||'cpm';f.querySelectorAll('.pk label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));app.querySelectorAll('.k-cpm').forEach(x=>x.hidden=p!=='cpm');
    if(!getSel().length){app.querySelector('#qb').innerHTML='<div class="af-q note">اختر مساحة لترى السعر.</div>';lastQ=null;return}
    try{const r=await api('adv_quote',{id:c.id||0,slots:getSel(),pricing:p,start:f.start.value,end:f.end.value,impr:+f.impr.value});lastQ=r.quote;app.querySelector('#qb').innerHTML=AdForm.quoteHTML(r.quote)}
    catch(e){lastQ=null;if(e.message!=='auth')app.querySelector('#qb').innerHTML=AdForm.quoteHTML(null,e.message)}},250)};
  f.querySelectorAll('[name=pricing],[name=start],[name=end],[name=impr]').forEach(x=>x.addEventListener('input',quote));quote();
  app.querySelector('#bk').onclick=()=>dash();
  f.onsubmit=async e=>{e.preventDefault();err();const fd=new FormData(f);if(!getSel().length)return err('اختر مساحة إعلانية');
    const b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='⏳ جاري الإرسال…';
    try{const r=await api('adv_save',{id:c.id||0,name:fd.get('name'),slots:getSel(),cats:fd.getAll('cats'),pricing:fd.get('pricing')||'cpm',impr:+fd.get('impr'),start:fd.get('start'),end:fd.get('end'),creatives:crs.value(),link:fd.get('link'),alt:fd.get('alt')});
      scrollTo(0,0);dash(`<div class="card"><h2 class="ok">✅ استلمنا حملتك!</h2><p>قيمة الحملة: <b>${AdForm.money(r.quote.total,r.quote.currency)}</b>. بعد إتمام الدفع نراجع الإعلان ونفعّله، ويصلك بريد بذلك.</p>${r.pay_info?`<div class="pay"><b>💳 طريقة الدفع</b>\n${esc(r.pay_info)}</div>`:'<p class="note">سيتواصل معك فريق فنتازيا لإتمام الدفع.</p>'}</div>`)}
    catch(er){if(er.message!=='auth'){err(er.message);b.disabled=false;b.textContent='📨 إرسال الحملة'}}}}
dash();
</script>
</body>
</html>
